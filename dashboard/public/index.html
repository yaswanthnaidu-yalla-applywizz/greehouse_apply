<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplyWizz Auto Apply Platform — Operator Dashboard (V2)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            page: '#FFF5EB',
            coral: '#E88474',
            dark: '#1A1A2E',
            card: '#FFFFFF',
            'metric-yellow': '#F4D66B',
            'metric-yellow-text': '#5C4A0A',
            'metric-coral': '#E88474',
            'metric-coral-text': '#6B2C2C',
            'metric-green': '#9AC89A',
            'metric-green-text': '#1E4620',
            'metric-blue': '#B8D4E8',
            'metric-blue-text': '#1E3A5F',
            supabase: '#10B981',
            ai: '#8B5CF6',
            manual: '#F59E0B',
            unresolved: '#EF4444'
          }
        }
      }
    }
  </script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>

  <style>
    /* Custom scrollbars */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #FFF5EB;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1A1A2E;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #E88474;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.15s ease-out forwards;
    }
    .mfa-qr-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="bg-[#FFF5EB] text-[#1A1A2E] antialiased overflow-hidden select-none font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const API_BASE_URL = window.location.origin;

    function getAuthHeaders() {
      const token = typeof localStorage !== 'undefined' ? localStorage.getItem('applywizz_auth_token') : null;
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    // -------------------------------------------------------------
    // Difficulty Badge Component
    // -------------------------------------------------------------
    function DifficultyBadge({ fieldsCount, level, className = '' }) {
      let resolvedLevel = level;
      if (!resolvedLevel) {
        if (fieldsCount === undefined || fieldsCount === null) resolvedLevel = 'Easy';
        else if (fieldsCount < 10) resolvedLevel = 'Easy';
        else if (fieldsCount <= 18) resolvedLevel = 'Medium';
        else resolvedLevel = 'Hard';
      }

      if (resolvedLevel === 'Easy') {
        return (
          <span className={`inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-[#9AC89A] text-[#1E4620] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
            Easy
          </span>
        );
      }

      if (resolvedLevel === 'Medium') {
        return (
          <span className={`inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-[#B8D4E8] text-[#1E3A5F] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
            Medium
          </span>
        );
      }

      return (
        <span className={`inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-[#E88474] text-white border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
          Hard
        </span>
      );
    }

    // -------------------------------------------------------------
    // Source Attribution Badge Component
    // -------------------------------------------------------------
    function SourceBadge({ source, confidence, isEdited }) {
      const activeSource = isEdited ? 'manual' : source;

      if (activeSource === 'manual') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#FEF3C7] text-[#92400E] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#D97706]"></span>
            <span>manual</span>
          </span>
        );
      }

      if (activeSource === 'unresolved') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#FEE2E2] text-[#991B1B] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#EF4444] animate-pulse"></span>
            <span>unresolved</span>
          </span>
        );
      }

      if (activeSource === 'supabase') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#D1FAE5] text-[#065F46] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#10B981]"></span>
            <span>supabase</span>
            {confidence !== undefined && (
              <span className="text-[10px] text-[#047857]">({(confidence * 100).toFixed(0)}%)</span>
            )}
          </span>
        );
      }

      if (activeSource === 'resume_parse') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#CFFAFE] text-[#155E75] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#06B6D4]"></span>
            <span>resume</span>
          </span>
        );
      }

      if (activeSource === 'fuzzy_match') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#DBEAFE] text-[#1E40AF] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#3B82F6]"></span>
            <span>fuzzy</span>
          </span>
        );
      }

      if (activeSource === 'api') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#E0E7FF] text-[#3730A3] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#6366F1]"></span>
            <span>api</span>
          </span>
        );
      }

      return (
        <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#EDE9FE] text-[#5B21B6] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
          <span className="w-1.5 h-1.5 rounded-full bg-[#8B5CF6]"></span>
          <span>ai</span>
        </span>
      );
    }

    // -------------------------------------------------------------
    // Application Status Badge Component
    // -------------------------------------------------------------
    function ApplicationStatusBadge({ status, applicationId, jobUrl, onStatusChange, proofWebUrl, proofEmailUrl, proofEmailJson, emailProofStatus, className = '' }) {
      const statusRef = useRef(status);
      statusRef.current = status;
      const emailProofStatusRef = useRef(emailProofStatus);
      emailProofStatusRef.current = emailProofStatus;
      const proofWebUrlRef = useRef(proofWebUrl);
      proofWebUrlRef.current = proofWebUrl;
      const proofEmailUrlRef = useRef(proofEmailUrl);
      proofEmailUrlRef.current = proofEmailUrl;
      const lastPolledFailedProofRef = useRef(null);

      useEffect(() => {
        const shouldPollStatus = status === 'APPLYING' || status === 'QUEUED' || status === 'FAILED';
        const shouldPollEmailProof = status === 'APPLIED' && emailProofStatus === 'pending';
        if ((!shouldPollStatus && !shouldPollEmailProof) || !applicationId) return;

        const pollInterval = setInterval(async () => {
          try {
            const url = `/api/applications/${encodeURIComponent(applicationId)}${jobUrl ? `?jobUrl=${encodeURIComponent(jobUrl)}` : ''}`;
            const res = await fetch(url, { headers: getAuthHeaders() });
            if (res.ok) {
              const appData = await res.json();
              const nextEmailStatus = appData.email_proof_status || appData.emailProofStatus || emailProofStatusRef.current;
              const nextProofWeb = appData.proof_web_url || appData.proofWebUrl || null;
              const nextProofEmail = appData.proof_email_url || appData.proofEmailUrl || null;
              const nextProofFailed = appData.proof_failed_url || appData.proofFailedUrl || null;
              const emailProofArrived = Boolean(nextProofEmail) && nextProofEmail !== proofEmailUrlRef.current;
              const webProofArrived = Boolean(nextProofWeb) && nextProofWeb !== proofWebUrlRef.current;
              const failedProofArrived = Boolean(nextProofFailed) && nextProofFailed !== lastPolledFailedProofRef.current;
              if (nextProofFailed) {
                lastPolledFailedProofRef.current = nextProofFailed;
              }
              const emailStatusChanged = nextEmailStatus && nextEmailStatus !== emailProofStatusRef.current;
              const statusChanged = appData.status && appData.status !== statusRef.current;
              if (statusChanged || emailStatusChanged || emailProofArrived || webProofArrived || failedProofArrived) {
                if (onStatusChange) {
                  onStatusChange(appData.status || statusRef.current, appData);
                }
              }
            }
          } catch (err) {
            console.warn('Polling error:', err);
          }
        }, 2000);

        return () => clearInterval(pollInterval);
      }, [status, emailProofStatus, applicationId, jobUrl, onStatusChange, proofWebUrl, proofEmailUrl]);

      switch (status) {
        case 'QUEUED':
          return (
            <span
              className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#FED7AA] text-[#9A3412] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] animate-pulse ${className}`}
              title="Queued for automated submission daemon"
            >
              <span className="w-2 h-2 rounded-full bg-[#EA580C]"></span>
              <span>Queued for Submit</span>
            </span>
          );
        case 'APPLIED':
          if (proofWebUrl && !proofEmailUrl && !proofEmailJson) {
            return (
              <span
                className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#E0F2FE] text-[#0369A1] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}
                title="A-Applied: Web confirmation proof captured, email proof pending or timed out"
              >
                <span className="w-2 h-2 rounded-full bg-[#0284C7]"></span>
                <span>A-Applied</span>
              </span>
            );
          }
          return (
            <span
              className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#9AC89A] text-[#1E4620] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}
              title="Applied & Verified: Both web and confirmation email proofs captured"
            >
              <span className="w-2 h-2 rounded-full bg-[#1E4620]"></span>
              <span>Applied &amp; Verified</span>
            </span>
          );
        case 'APPLYING':
          return (
            <span className={`inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#E88474] text-white border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] animate-pulse ${className}`}>
              <span className="w-2 h-2 rounded-full border-2 border-white border-t-transparent animate-spin"></span>
              <span>Submitting... (Live)</span>
            </span>
          );
        case 'DRY_RUN_COMPLETE':
          return (
            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#B8D4E8] text-[#1E3A5F] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
              <span className="w-2 h-2 rounded-full bg-[#1E3A5F]"></span>
              <span>Dry-Run Complete</span>
            </span>
          );
        case 'CAPTCHA_REQUIRED':
        case 'OTP_REQUIRED':
          return (
            <span className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold font-mono bg-[#F59E0B] text-[#451A03] border-2 border-[#1A1A2E] shadow-[2px_2px_0px_#1A1A2E] ring-2 ring-[#FBBF24] animate-pulse ${className}`} title="Verification code or CAPTCHA required — complete challenge to proceed">
              <span className="text-sm leading-none">🔐</span>
              <span>{status === 'CAPTCHA_REQUIRED' ? 'CAPTCHA Required' : 'OTP Required'}</span>
            </span>
          );
        case 'FAILED':
          return (
            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#EF4444] text-white border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
              <span className="w-2 h-2 rounded-full bg-white"></span>
              <span>Submission Failed</span>
            </span>
          );
        case 'EXPIRED':
          return (
            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#E2E8F0] text-[#475569] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
              <span>Closed / Expired</span>
            </span>
          );
        case 'READY_FOR_REVIEW':
        default:
          return (
            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#F4D66B] text-[#5C4A0A] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
              <span className="w-2 h-2 rounded-full bg-[#5C4A0A]"></span>
              <span>Ready for Review</span>
            </span>
          );
      }
    }

    // -------------------------------------------------------------
    // Submission Controls Component
    // -------------------------------------------------------------
    function SubmissionControls({
      applicationId,
      jobUrl = '',
      status,
      unresolvedFieldsCount,
      proofWebUrl,
      proofEmailUrl,
      proofEmailJson,
      emailProofStatus,
      dryRunScreenshotUrl,
      proofFailedUrl,
      isSubmitting = false,
      isDryRunning = false,
      apiBaseUrl = '',
      onTriggerDryRun,
      onTriggerSubmit,
      onStatusChange,
      onOtpVerified,
      onViewProof,
      onViewEmailProof,
      onViewDryRun,
      onViewFailureScreenshot,
    }) {
      const [applicationStatus, setApplicationStatus] = useState(status);
      const [otpValue, setOtpValue] = useState('');
      const [otpLoading, setOtpLoading] = useState(false);
      const [otpError, setOtpError] = useState(null);
      const [showOtpModal, setShowOtpModal] = useState(false);
      const [proofUrl, setProofUrl] = useState(proofWebUrl || null);
      const [emailProof, setEmailProof] = useState(proofEmailUrl || null);
      const [emailProofJsonState, setEmailProofJsonState] = useState(proofEmailJson || null);
      const [isCapturingEmailProof, setIsCapturingEmailProof] = useState(false);
      const [showProofViewer, setShowProofViewer] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      useEffect(() => {
        setApplicationStatus(status);
        if (status === 'OTP_REQUIRED') {
          setOtpError(null);
        }
      }, [status]);

      useEffect(() => {
        if (proofWebUrl) {
          setProofUrl(proofWebUrl);
        }
      }, [proofWebUrl]);

      useEffect(() => {
        if (proofEmailUrl) {
          setEmailProof(proofEmailUrl);
        }
      }, [proofEmailUrl]);

      useEffect(() => {
        if (proofEmailJson) {
          setEmailProofJsonState(proofEmailJson);
        }
      }, [proofEmailJson]);

      const hasUnresolved = unresolvedFieldsCount > 0;
      const isApplying = applicationStatus === 'APPLYING' || isSubmitting;
      const isApplied = applicationStatus === 'APPLIED';
      const isFailed = applicationStatus === 'FAILED';
      const isOtp = applicationStatus === 'OTP_REQUIRED';
      const hasProofActions =
        Boolean(dryRunScreenshotUrl) ||
        Boolean(proofUrl || proofWebUrl || isApplied) ||
        Boolean(emailProofJsonState || proofEmailJson) ||
        Boolean(emailProof || proofEmailUrl) ||
        Boolean((proofUrl || proofWebUrl) && !(emailProofJsonState || proofEmailJson || emailProof || proofEmailUrl)) ||
        Boolean(isFailed && proofFailedUrl);

      const pollStatusUpdate = async () => {
        try {
          const pollUrl = `${apiBaseUrl}/api/applications/${encodeURIComponent(applicationId)}${jobUrl ? `?jobUrl=${encodeURIComponent(jobUrl)}` : ''}`;
          const res = await fetch(pollUrl, {
            headers: getAuthHeaders(),
          });
          if (res.ok) {
            const appData = await res.json();
            const resolvedJson = appData.proofEmailJson || appData.proof_email_json || null;
            if (resolvedJson) {
              setEmailProofJsonState(resolvedJson);
            }
            const resolvedEmail = appData.proofEmailUrl || appData.proof_email_url || null;
            if (resolvedEmail) {
              setEmailProof(resolvedEmail);
            }
            if (onStatusChange) {
              onStatusChange(appData.status || applicationStatus, appData);
            }
          }
        } catch (err) {
          console.warn(`[SubmissionControls] Status poll error for ${applicationId}:`, err);
        }
      };

      const handleVerifyOtp = async () => {
        const cleanOtp = otpValue.trim();
        if (!cleanOtp) {
          setOtpError('Please enter the OTP code.');
          return;
        }

        setOtpLoading(true);
        setOtpError(null);
        setApplicationStatus('APPLYING');
        if (onStatusChange) onStatusChange('APPLYING');

        try {
          const res = await fetch(
            `${apiBaseUrl}/api/applications/${encodeURIComponent(applicationId)}/submit-otp`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
              body: JSON.stringify({ otp: cleanOtp, jobUrl: jobUrl || undefined }),
            }
          );
          const data = await res.json();
          const resolvedProofUrl = data.proofUrl || data.proofWebUrl;
          const proofCapturedAt = data.proofCapturedAt;

          if (!res.ok || data.status !== 'APPLIED') {
            setOtpError(data.error || 'OTP verification failed.');
            setApplicationStatus('OTP_REQUIRED');
            await pollStatusUpdate();
            return;
          }

          setApplicationStatus('APPLIED');
          setProofUrl(resolvedProofUrl);
          setShowOtpModal(false);
          setShowProofViewer(true);
          setOtpValue('');
          setToastMessage('🎉 Application submitted! Proof captured.');
          setTimeout(() => setToastMessage(null), 6000);

          if (onStatusChange) {
            onStatusChange('APPLIED', {
              ...data,
              proofWebUrl: resolvedProofUrl,
              proof_web_url: resolvedProofUrl,
              proofCapturedAt,
              proof_captured_at: proofCapturedAt,
            });
          }

          if (onOtpVerified) {
            onOtpVerified({ proofWebUrl: resolvedProofUrl, proofCapturedAt });
          } else if (resolvedProofUrl && onViewProof) {
            onViewProof();
          }
        } catch (err) {
          console.error('OTP verification failed:', err);
          setOtpError(err.message || 'OTP verification failed.');
          setApplicationStatus('OTP_REQUIRED');
          await pollStatusUpdate();
        } finally {
          setOtpLoading(false);
        }
      };

      const handleCaptureEmailProof = async () => {
        setIsCapturingEmailProof(true);
        try {
          const token = typeof localStorage !== 'undefined' ? localStorage.getItem('applywizz_auth_token') : null;
          const res = await fetch(
            `${apiBaseUrl}/api/applications/${encodeURIComponent(applicationId)}/capture-email-proof`,
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
              },
              body: JSON.stringify({ jobUrl: jobUrl || undefined }),
            }
          );
          const data = await res.json();
          const capturedJson = data.proofEmailJson || data.proof_email_json;
          if (res.ok && data.success && capturedJson) {
            setEmailProofJsonState(capturedJson);
            setToastMessage('🎉 Confirmation email proof captured!');
            setTimeout(() => setToastMessage(null), 6000);
            if (onStatusChange) {
              onStatusChange('APPLIED', {
                ...data,
                proof_email_json: capturedJson,
                proofEmailJson: capturedJson,
                proof_email_captured_at: data.proofEmailCapturedAt,
                proofEmailCapturedAt: data.proofEmailCapturedAt,
                email_proof_status: 'captured',
                emailProofStatus: 'captured',
              });
            }
            if (onViewEmailProof) {
              onViewEmailProof();
            }
          } else {
            setToastMessage(`⚠️ ${data.error || 'Confirmation email not found yet. Retrying in background...'}`);
            setTimeout(() => setToastMessage(null), 5000);
            await pollStatusUpdate();
          }
        } catch (err) {
          console.error('Capture email proof failed:', err);
          setToastMessage(`❌ Capture email proof failed: ${err.message}`);
          setTimeout(() => setToastMessage(null), 5000);
        } finally {
          setIsCapturingEmailProof(false);
        }
      };

      const canSubmit = !hasUnresolved && !isApplying && (applicationStatus === 'READY_FOR_REVIEW' || applicationStatus === 'DRY_RUN_COMPLETE' || applicationStatus === 'FAILED');
      const canDryRun = !isApplying && !isDryRunning;

      return (
        <>
          {/* OTP Entry Modal */}
          {isOtp && showOtpModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#1A1A2E]/50 p-4">
              <div
                className="bg-white border-2 border-[#1A1A2E] rounded-xl p-6 w-full max-w-md shadow-[6px_6px_0px_#1A1A2E]"
                role="dialog"
                aria-modal="true"
                aria-labelledby="otp-modal-title"
              >
                <div className="flex items-center justify-between mb-2">
                  <h2 id="otp-modal-title" className="text-lg font-bold text-[#1A1A2E] flex items-center gap-2">
                    <span>🔐</span>
                    <span>Enter OTP</span>
                  </h2>
                  <button
                    type="button"
                    onClick={() => setShowOtpModal(false)}
                    className="text-[#64748B] hover:text-[#1A1A2E] text-sm font-bold px-1.5 py-0.5 rounded"
                    title="Close modal"
                  >
                    ✕
                  </button>
                </div>
                <p className="text-xs text-[#64748B] mb-4 font-medium">
                  A verification code was sent after submission. Enter it below to complete the application.
                </p>
                {otpError && (
                  <div className="mb-3 px-3 py-2 bg-[#FEE2E2] border border-[#EF4444] rounded text-xs text-[#991B1B] font-semibold flex items-center gap-2">
                    <span>⚠️</span>
                    <span>{otpError}</span>
                  </div>
                )}
                <input
                  type="text"
                  inputMode="text"
                  maxLength={16}
                  autoComplete="one-time-code"
                  placeholder="Enter OTP code (e.g. Aebf0aDc)"
                  value={otpValue}
                  disabled={otpLoading}
                  onChange={(e) => {
                    setOtpValue(e.target.value);
                    if (otpError) setOtpError(null);
                  }}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter' && !otpLoading) handleVerifyOtp();
                  }}
                  className="w-full px-3 py-2.5 mb-4 rounded-md border-2 border-[#1A1A2E] text-sm font-mono text-[#1A1A2E] placeholder:text-[#94A3B8] focus:outline-none focus:ring-2 focus:ring-[#F59E0B] disabled:opacity-60"

    // -------------------------------------------------------------
    // Editable Form Field Component
    // -------------------------------------------------------------
    function EditableFormField({ field, applicationId, jobUrl, onFieldUpdate }) {
      const [isEditing, setIsEditing] = useState(false);
      const [value, setValue] = useState(field.value || '');
      const [isConfirming, setIsConfirming] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [error, setError] = useState(null);
      const inputRef = useRef(null);
      const confirmBtnRef = useRef(null);

      useEffect(() => {
        setValue(field.value || '');
      }, [field.value]);

      useEffect(() => {
        if (isEditing && !isConfirming && inputRef.current) {
          inputRef.current.focus();
        }
      }, [isEditing, isConfirming]);

      useEffect(() => {
        if (isConfirming && confirmBtnRef.current) {
          confirmBtnRef.current.focus();
        }
      }, [isConfirming]);

      const handleRequestSave = () => {
        if (value === (field.value || '')) {
          setIsEditing(false);
          setIsConfirming(false);
          setError(null);
          return;
        }
        setIsConfirming(true);
      };

      const executeSave = async () => {
        setIsSaving(true);
        setError(null);

        try {
          const response = await fetch(
            `/api/applications/${encodeURIComponent(applicationId)}/fields/${encodeURIComponent(field.fieldId)}`,
            {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
              body: JSON.stringify({ value, jobUrl }),
            }
          );

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || `HTTP error ${response.status}`);
          }

          const updatedField = await response.json();
          setIsConfirming(false);
          setIsEditing(false);
          if (onFieldUpdate) {
            onFieldUpdate(updatedField);
          }
        } catch (err) {
          console.error('Failed to update field:', err);
          setError(err.message || 'Failed to save');
        } finally {
          setIsSaving(false);
        }
      };

      const handleCancelEdit = () => {
        setValue(field.value || '');
        setError(null);
        setIsConfirming(false);
        setIsEditing(false);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Escape') {
          handleCancelEdit();
        } else if (e.key === 'Enter' && field.type !== 'textarea') {
          e.preventDefault();
          if (isConfirming) {
            executeSave();
          } else {
            handleRequestSave();
          }
        }
      };

      const isTextarea = field.type === 'textarea';
      const isUnresolved = field.source === 'unresolved';

      return (
        <div
          className={`group relative p-3.5 rounded-lg bg-white transition-all ${
            isUnresolved && (field.isRequired || field.required)
              ? 'border-2 border-[#EF4444] shadow-[2px_2px_0px_#EF4444]'
              : 'border border-[#1A1A2E] shadow-[2px_2px_0px_#1A1A2E]'
          }`}
        >
          <div className="flex items-start justify-between gap-3 mb-1.5">
            <div className="flex-1">
              <label className="text-xs font-bold text-[#1A1A2E] flex items-center gap-1.5">
                <span>{field.label}</span>
                {(field.isRequired || field.required) && <span className="text-[#EF4444] font-bold">*</span>}
                <span className="text-[10px] font-mono text-[#64748B] font-normal">({field.type})</span>
              </label>
            </div>

            <div className="flex items-center gap-2 shrink-0">
              <SourceBadge
                source={field.source}
                confidence={field.confidence}
                isEdited={field.isEdited}
              />
              {!isEditing && (
                <button
                  type="button"
                  onClick={() => setIsEditing(true)}
                  title="Click to edit field value"
                  className="opacity-60 group-hover:opacity-100 px-2 py-1 text-[#1A1A2E] hover:bg-[#FAF4EB] border border-transparent hover:border-[#1A1A2E] rounded transition text-xs flex items-center gap-1 font-medium"
                >
                  <span>edit</span>
                  <span aria-hidden>✏️</span>
                </button>
              )}
            </div>
          </div>

          {isEditing ? (
            <div className="relative mt-1">
              {isTextarea ? (
                <textarea
                  ref={inputRef}
                  value={value}
                  onChange={(e) => setValue(e.target.value)}
                  onKeyDown={handleKeyDown}
                  disabled={isSaving || isConfirming}
                  rows={3}
                  className="w-full text-xs font-mono p-2.5 bg-[#FFFDF9] border-2 border-[#1A1A2E] rounded-md focus:outline-none focus:ring-2 focus:ring-[#E88474] transition text-[#1A1A2E] disabled:opacity-75"
                />
              ) : (
                <input
                  ref={inputRef}
                  type="text"
                  value={value}
                  onChange={(e) => setValue(e.target.value)}
                  onKeyDown={handleKeyDown}
                  disabled={isSaving || isConfirming}
                  className="w-full text-xs font-mono p-2 bg-[#FFFDF9] border-2 border-[#1A1A2E] rounded-md focus:outline-none focus:ring-2 focus:ring-[#E88474] transition text-[#1A1A2E] disabled:opacity-75"
                />
              )}

              {!isConfirming ? (
                <div className="flex items-center justify-between mt-2 pt-2 border-t border-gray-200">
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={handleRequestSave}
                      disabled={isSaving}
                      className="px-3 py-1 bg-[#10B981] hover:bg-[#059669] text-white font-bold text-xs rounded border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px] transition-all flex items-center gap-1"
                    >
                      <span>💾</span>
                      <span>Save Changes</span>
                    </button>
                    <button
                      type="button"
                      onClick={handleCancelEdit}
                      disabled={isSaving}
                      className="px-2.5 py-1 bg-white hover:bg-gray-100 text-[#1A1A2E] font-medium text-xs rounded border border-gray-300 transition-all"
                    >
                      Cancel
                    </button>
                  </div>
                  <span className="text-[10px] text-[#64748B] font-mono">
                    Press Enter to save, Esc to cancel
                  </span>
                </div>
              ) : (
                <div className="mt-2.5 p-3 rounded-lg bg-[#FEF3C7] border-2 border-[#1A1A2E] shadow-[2px_2px_0px_#1A1A2E] animate-fadeIn">
                  <div className="flex items-start gap-2">
                    <span className="text-base leading-none">⚠️</span>
                    <div className="flex-1">
                      <p className="text-xs font-bold text-[#1A1A2E]">
                        Are you sure you want to update this answer?
                      </p>
                      <div className="mt-2 text-[11px] font-mono space-y-1">
                        <div className="text-[#64748B] flex items-baseline gap-1.5">
                          <span className="font-semibold text-gray-500 shrink-0">Current:</span>
                          <span className="line-through text-[#EF4444] bg-white/80 px-1.5 py-0.5 rounded border border-gray-300 break-all">
                            {field.value || '(empty)'}
                          </span>
                        </div>
                        <div className="text-[#1A1A2E] flex items-baseline gap-1.5">
                          <span className="font-semibold text-gray-700 shrink-0">New:</span>
                          <span className="font-bold text-[#065F46] bg-white px-1.5 py-0.5 rounded border border-[#1A1A2E] break-all">
                            {value || '(empty)'}
                          </span>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 mt-3">
                        <button
                          ref={confirmBtnRef}
                          type="button"
                          onClick={executeSave}
                          disabled={isSaving}
                          className="px-3 py-1.5 bg-[#10B981] hover:bg-[#059669] text-white font-bold text-xs rounded border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px] transition-all flex items-center gap-1 disabled:opacity-50"
                        >
                          {isSaving ? (
                            <span>Saving...</span>
                          ) : (
                            <>
                              <span>✅</span>
                              <span>Yes, Update Answer</span>
                            </>
                          )}
                        </button>
                        <button
                          type="button"
                          onClick={() => setIsConfirming(false)}
                          disabled={isSaving}
                          className="px-3 py-1.5 bg-white hover:bg-gray-100 text-[#1A1A2E] font-bold text-xs rounded border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px] transition-all"
                        >
                          Keep Editing
                        </button>
                        <button
                          type="button"
                          onClick={handleCancelEdit}
                          disabled={isSaving}
                          className="px-2 py-1.5 text-xs text-[#64748B] hover:text-[#EF4444] font-medium"
                        >
                          Discard & Cancel
                        </button>
                      </div>
                      {error && <p className="mt-2 text-xs font-bold text-[#EF4444]">{error}</p>}
                    </div>
                  </div>
                </div>
              )}
            </div>
          ) : (
            <div
              onClick={() => setIsEditing(true)}
              title="Click to edit answer"
              className="mt-1 p-2 rounded-md bg-[#FAF4EB] border border-[#1A1A2E] hover:bg-[#F5ECE0] cursor-pointer transition text-xs font-mono break-words"
            >
              {field.value && field.value.trim().length > 0 ? (
                <span className="text-[#1A1A2E] font-medium">{field.value}</span>
              ) : (field.isRequired || field.required) ? (
                <span className="text-[#EF4444] font-bold italic">⚠️ Unresolved required field (click to provide answer)</span>
              ) : (
                <span className="text-[#64748B] italic">(Optional — left blank)</span>
              )}
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // Email proof (JSON) renderer — no screenshots
    // -------------------------------------------------------------
    function EmailProofRenderer({ proof, companyName }) {
      if (!proof) return null;
      const received = proof.received_at ? new Date(proof.received_at).toLocaleString() : proof.received_at;
      const body = (proof.body_text || '').slice(0, 4000);
      const highlight = (text, company) => {
        if (!company || company.length < 2) return text;
        const parts = text.split(new RegExp(`(${company.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')})`, 'gi'));
        return parts.map((part, i) =>
          part.toLowerCase() === company.toLowerCase()
            ? React.createElement('strong', { key: i, className: 'font-bold bg-[#FEF3C7] px-0.5 rounded' }, part)
            : part
        );
      };
      return (
        <article className="bg-white border-2 border-[#1A1A2E] rounded-xl shadow-[4px_4px_0px_#1A1A2E] overflow-hidden text-[#1A1A2E]">
          <header className="px-5 py-4 bg-[#EFF6FF] border-b-2 border-[#1A1A2E]">
            <p className="text-[10px] font-bold uppercase tracking-wider text-[#64748B] font-mono mb-1">Confirmation email proof</p>
            <h3 className="text-sm font-bold break-words">{proof.subject || '(No subject)'}</h3>
            <p className="text-xs font-mono mt-2"><span className="text-[#64748B]">From </span>{proof.from}</p>
            <p className="text-xs font-mono"><span className="text-[#64748B]">Received </span>{received}</p>
          </header>
          <div className="px-5 py-4 bg-[#FAF4EB] max-h-[50vh] overflow-y-auto text-xs leading-relaxed whitespace-pre-wrap break-words">
            {highlight(body, companyName)}
          </div>
        </article>
      );
    }

    function EmailProofModal({ isOpen, onClose, proof, companyName, metadata = {} }) {
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        if (isOpen) {
          window.addEventListener('keydown', onKey);
          document.body.style.overflow = 'hidden';
        }
        return () => {
          window.removeEventListener('keydown', onKey);
          document.body.style.overflow = 'unset';
        };
      }, [isOpen, onClose]);
      if (!isOpen || !proof) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#1A1A2E]/80 backdrop-blur-sm" onClick={onClose}>
          <div className="relative w-full max-w-2xl" onClick={(e) => e.stopPropagation()}>
            <div className="flex justify-end mb-2">
              <button type="button" onClick={onClose} className="text-white font-bold px-2 py-1 border border-white/40 rounded">✕</button>
            </div>
            <EmailProofRenderer proof={proof} companyName={companyName} />
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // Proof Viewer Modal Component
    // -------------------------------------------------------------
    function ProofViewer({ isOpen, onClose, screenshotUrl, title = 'Application Verification Proof', metadata = {} }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        if (isOpen) {
          window.addEventListener('keydown', handleKeyDown);
          document.body.style.overflow = 'hidden';
        }
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = 'unset';
        };
      }, [isOpen, onClose]);

      if (!isOpen || !screenshotUrl) return null;

      const handleDownload = () => {
        const link = document.createElement('a');
        link.href = screenshotUrl;
        link.download = `${metadata.applywizzId || 'candidate'}_${metadata.companyName || 'proof'}_verification.png`;
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const formattedDate = metadata.capturedAt
        ? new Date(metadata.capturedAt).toLocaleString()
        : 'Recently captured';

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#1A1A2E]/80 backdrop-blur-sm animate-fadeIn"
          onClick={onClose}
        >
          <div
            className="relative flex flex-col w-full max-w-5xl max-h-[90vh] bg-white rounded-xl shadow-[8px_8px_0px_#1A1A2E] border-2 border-[#1A1A2E] overflow-hidden text-[#1A1A2E]"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between px-6 py-4 border-b-2 border-[#1A1A2E] bg-[#FAF4EB]">
              <div className="flex items-center gap-3">
                <span className="text-2xl">📸</span>
                <div>
                  <h2 className="text-base font-bold text-[#1A1A2E]">{title}</h2>
                  <p className="text-xs font-mono text-[#64748B]">
                    {metadata.companyName ? `${metadata.companyName} — ` : ''}
                    {metadata.jobTitle || 'Greenhouse Application'}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {metadata.status && <ApplicationStatusBadge status={metadata.status} />}
                <button
                  type="button"
                  onClick={handleDownload}
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold text-white bg-[#E88474] hover:bg-[#D67161] border border-[#1A1A2E] rounded-md shadow-[2px_2px_0px_#1A1A2E] transition-all"
                >

    // -------------------------------------------------------------
    // Form Renderer Component
    // -------------------------------------------------------------
    function FormRenderer({ application, isLoading, candidateName, onFieldUpdate, onStatusChange }) {
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isDryRunning, setIsDryRunning] = useState(false);
      const [viewerOpen, setViewerOpen] = useState(false);
      const [viewerImageUrl, setViewerImageUrl] = useState(null);
      const [viewerTitle, setViewerTitle] = useState('Application Proof');
      const [emailProofOpen, setEmailProofOpen] = useState(false);
      const appId = application?.id || application?.applywizzId || application?.applywizz_id || 'app-default';
      const jobUrl = application?.jobUrl || application?.job_url || '';
      const storageKey = `greenhouse_approvals_${appId}_${typeof btoa !== 'undefined' ? btoa(encodeURIComponent(jobUrl || 'default')).slice(0, 32) : 'default'}`;

      const getStoredApprovals = (key) => {
        try {
          const saved = typeof localStorage !== 'undefined' ? localStorage.getItem(key) : null;
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return new Set(parsed);
          }
        } catch {}
        return new Set();
      };

      const [carouselIndex, setCarouselIndex] = useState(0);
      const [approvedFieldIds, setApprovedFieldIds] = useState(() => getStoredApprovals(storageKey));
      const [viewMode, setViewMode] = useState('carousel');
      const [filterActionableOnly, setFilterActionableOnly] = useState(false);

      useEffect(() => {
        setCarouselIndex(0);
        setApprovedFieldIds(getStoredApprovals(storageKey));
      }, [appId, jobUrl, storageKey]);

      const saveApprovedFields = (nextSet) => {
        setApprovedFieldIds(nextSet);
        try {
          if (typeof localStorage !== 'undefined') {
            localStorage.setItem(storageKey, JSON.stringify(Array.from(nextSet)));
          }
        } catch {}
      };

      const persistApproval = async (fieldsToPersist) => {
        try {
          const targetFields = fieldsToPersist || fields;
          const targetAppId = application?.id || application?.applywizzId || application?.applywizz_id || appId;
          await fetch(`/api/applications/${encodeURIComponent(targetAppId)}/approve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
            body: JSON.stringify({
              jobUrl,
              resolved_fields: targetFields,
              companyName: application?.companyName || application?.company_name,
              jobTitle: application?.jobTitle || application?.job_title,
              status: application?.status || 'READY_FOR_REVIEW',
            }),
          });
        } catch (e) {
          console.warn('[FormRenderer] Could not persist approval to server:', e);
        }
      };

      const fields = application?.resolvedFields || application?.resolved_fields || [];
      const manualCount = fields.filter((f) => f.isEdited || f.source === 'manual').length;
      const supabaseCount = fields.filter((f) => f.source === 'supabase' && !f.isEdited).length;
      const aiCount = fields.filter((f) => f.source === 'ai' && !f.isEdited).length;
      const unresCount = fields.filter(
        (f) => (f.isRequired || f.required) && (!f.value || f.value.trim().length === 0 || f.source === 'unresolved')
      ).length;
      const currentStatus = application?.status || 'READY_FOR_REVIEW';

      const isDemographic = (label) => {
        const l = (label || '').toLowerCase();
        return (
          l.includes('gender') ||
          l.includes('race') ||
          l.includes('ethnicity') ||
          l.includes('veteran') ||
          l.includes('disability')
        );
      };

      const actionableFields = fields.filter(
        (f) => !isDemographic(f.label) || f.source === 'ai' || f.source === 'unresolved' || (f.isRequired || f.required)
      );

      const displayFields = filterActionableOnly && actionableFields.length > 0
        ? actionableFields
        : fields;

      const boundedIndex = Math.min(Math.max(0, carouselIndex), Math.max(0, displayFields.length - 1));
      const currentField = displayFields[boundedIndex];

      const handleApproveAndNext = () => {
        if (currentField) {
          const next = new Set([...approvedFieldIds, currentField.fieldId]);
          saveApprovedFields(next);
          persistApproval();
        }
        if (boundedIndex < displayFields.length - 1) {
          setCarouselIndex((prev) => prev + 1);
        }
      };

      const handleApproveAll = () => {
        const next = new Set(displayFields.map((f) => f.fieldId));
        saveApprovedFields(next);
        persistApproval();
        setCarouselIndex(Math.max(0, displayFields.length - 1));
      };

      useEffect(() => {
        if (!application || isLoading) return;
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            handleApproveAndNext();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [boundedIndex, displayFields, currentField, application, isLoading]);

      if (isLoading) {
        return (
          <div className="flex-1 p-12 flex flex-col items-center justify-center text-[#64748B]">
            <div className="w-8 h-8 border-2 border-[#1A1A2E] border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-xs font-mono font-bold text-[#1A1A2E]">Loading application form...</p>
          </div>
        );
      }

      if (!application) {
        return (
          <div className="flex-1 p-12 flex flex-col items-center justify-center text-[#64748B]">
            <div className="text-4xl mb-3">📋</div>
            <p className="text-sm font-bold text-[#1A1A2E]">No Job Selected</p>
            <p className="text-xs text-[#64748B] mt-1 font-medium">
              Select a candidate from the left directory and click a job tab above to review and submit.
            </p>
          </div>
        );
      }

      const handleTriggerDryRun = async () => {
        setIsDryRunning(true);
        try {
          const res = await fetch(`/api/applications/${encodeURIComponent(appId)}/dry-run`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
            body: JSON.stringify({
              headless: false,
              jobUrl: application.jobUrl || application.job_url,
            }),
          });
          const data = await res.json();
          if (data.screenshotUrl) {
            setViewerImageUrl(data.screenshotUrl);
            setViewerTitle('Dry-Run Form Verification Screenshot');
            setViewerOpen(true);
          }
          if (onStatusChange) onStatusChange('DRY_RUN_COMPLETE', data);
        } catch (err) {
          console.error('Dry run failed:', err);
          alert(`Dry run failed: ${err.message}`);
        } finally {
          setIsDryRunning(false);
        }
      };

      const handleTriggerSubmit = async () => {
        setIsSubmitting(true);
        if (onStatusChange) onStatusChange('APPLYING');
        try {
          const res = await fetch(`/api/applications/${encodeURIComponent(appId)}/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
            body: JSON.stringify({
              headless: true,
              jobUrl: application.jobUrl || application.job_url,
            }),
          });
          const data = await res.json();
          let proofWebUrl = data.proofWebUrl;
          let proofCapturedAt = data.proofCapturedAt;

          if (data.status === 'APPLIED' && !proofWebUrl) {
            try {
              const proofRes = await fetch(`/api/applications/${encodeURIComponent(appId)}/proof`, {
                headers: getAuthHeaders(),
              });
              if (proofRes.ok) {
                const proofData = await proofRes.json();
                proofWebUrl = proofData.proofWebUrl;
                proofCapturedAt = proofData.proofCapturedAt;
              }
            } catch {}
          }

          if (data.status && onStatusChange) {
            onStatusChange(data.status, {
              ...data,
              proofWebUrl,
              proofCapturedAt,
            });
          }

          if (proofWebUrl) {
            setViewerImageUrl(proofWebUrl);
            setViewerTitle('Live Application Confirmation Proof');
            setViewerOpen(true);
          }
        } catch (err) {
          console.error('Submission failed:', err);
          if (onStatusChange) onStatusChange('FAILED', { error: err.message });
          alert(`Submission error: ${err.message}`);
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="flex-1 overflow-y-auto px-5 py-3.5 md:px-7 md:py-4 max-w-5xl mx-auto w-full custom-scrollbar">
          <EmailProofModal
            isOpen={emailProofOpen}
            onClose={() => setEmailProofOpen(false)}
            proof={application.proof_email_json || application.proofEmailJson}
            companyName={application.companyName || application.company_name}
          />
          <ProofViewer
            isOpen={viewerOpen}
            onClose={() => setViewerOpen(false)}
            screenshotUrl={viewerImageUrl}
            title={viewerTitle}
            metadata={{
              candidateName: candidateName || application.clientName,
              applywizzId: application.applywizzId || application.applywizz_id,
              companyName: application.companyName || application.company_name,
              jobTitle: application.jobTitle || application.job_title,
              jobUrl: application.jobUrl || application.job_url,
              capturedAt: application.proof_captured_at || application.submitted_at || new Date().toISOString(),
              status: currentStatus,
            }}
          />

          {/* Compact Job Header Card */}
          <div className="bg-white border-2 border-[#1A1A2E] rounded-xl px-4 py-3 md:px-5 md:py-3.5 mb-3 shadow-[3px_3px_0px_#1A1A2E]">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 border-b-2 border-[#1A1A2E] pb-2.5 mb-2.5">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-1.5 mb-1 flex-wrap">
                  <span className="text-xs font-bold uppercase tracking-wider text-[#1A1A2E]">
                    🏢 {application.companyName || application.company_name || 'Greenhouse Posting'}
                  </span>
                  <span className="text-[#1A1A2E] font-bold">•</span>
                  <span className="text-[11px] font-mono font-bold text-[#1A1A2E] bg-[#FAF4EB] px-1.5 py-0.5 rounded border border-[#1A1A2E]">
                    {application.applywizzId || application.applywizz_id}

    // -------------------------------------------------------------
    // AuthView Component (Sign In & Sign Up with Authenticator TOTP)
    // -------------------------------------------------------------
    function formatQrCodeSrc(qr) {
      if (!qr) return '';
      let trimmed = qr.trim();
      if (trimmed.startsWith('data:image/')) return trimmed;
      if (trimmed.startsWith('<svg') || trimmed.includes('<svg')) {
        if (!trimmed.includes('xmlns=')) {
          trimmed = trimmed.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        try {
          return `data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(trimmed)))}`;
        } catch (e) {
          return `data:image/svg+xml;utf-8,${encodeURIComponent(trimmed)}`;
        }
      }
      return trimmed;
    }

    function AuthView({ onAuthSuccess }) {
      const [tab, setTab] = useState('signin'); // 'signin' | 'signup'

      // Sign In state (Passwordless - Email + Microsoft Authenticator TOTP)
      const [signInEmail, setSignInEmail] = useState('');
      const [signInTotpCode, setSignInTotpCode] = useState('');
      const [signInStep, setSignInStep] = useState('prompt');
      const [signInLoading, setSignInLoading] = useState(false);
      const [signInError, setSignInError] = useState('');
      const [signInSuccessMsg, setSignInSuccessMsg] = useState('');

      // Sign Up state (Passwordless - Email -> Azure OTP -> Microsoft Authenticator Setup)
      const [signUpEmail, setSignUpEmail] = useState('');
      const [signUpOtpCode, setSignUpOtpCode] = useState('');
      const [signUpStep, setSignUpStep] = useState('email'); // 'email' | 'otp' | 'mfa_enroll'
      const [signUpLoading, setSignUpLoading] = useState(false);
      const [signUpError, setSignUpError] = useState('');
      const [resendCooldown, setResendCooldown] = useState(0);

      // Microsoft Authenticator Enrollment State
      const [mfaFactorId, setMfaFactorId] = useState('');
      const [mfaTempToken, setMfaTempToken] = useState('');
      const [mfaQrCode, setMfaQrCode] = useState('');
      const [mfaSecret, setMfaSecret] = useState('');
      const [mfaTotpCode, setMfaTotpCode] = useState('');
      const [mfaLoading, setMfaLoading] = useState(false);
      const [mfaError, setMfaError] = useState('');
      const [pendingUser, setPendingUser] = useState(null);

      useEffect(() => {
        if (resendCooldown <= 0) return;
        const interval = setInterval(() => {
          setResendCooldown((prev) => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(interval);
      }, [resendCooldown]);

      const resetAll = () => {
        setSignInError('');
        setSignUpError('');
        setMfaError('');
        setSignUpStep('email');
        setSignInStep('prompt');
        setSignUpOtpCode('');
        setMfaTotpCode('');
        setMfaQrCode('');
        setMfaSecret('');
        setMfaFactorId('');
        setMfaTempToken('');
        setPendingUser(null);
      };

      const handleSendSignUpOtp = async (e) => {
        if (e) e.preventDefault();
        setSignUpError('');
        const trimmed = signUpEmail.trim();
        if (!trimmed || !trimmed.includes('@')) {
          setSignUpError('Please enter a valid email address.');
          return;
        }

        setSignUpLoading(true);
        try {
          const res = await fetch('/api/auth/send-signup-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: trimmed }),
          });
          const data = await res.json();
          if (!res.ok) {
            setSignUpError(data.error || 'Failed to dispatch verification code.');
            return;
          }

          setSignUpStep('otp');
          setResendCooldown(30);
        } catch (err) {
          setSignUpError('Network error dispatching verification email. Please check your connection.');
        } finally {
          setSignUpLoading(false);
        }
      };

      const handleVerifySignUpOtp = async (e) => {
        if (e) e.preventDefault();
        setSignUpError('');
        const cleanOtp = signUpOtpCode.trim().replace(/\D/g, '');
        if (!cleanOtp || cleanOtp.length !== 6) {
          setSignUpError('Please enter the 6-digit verification code sent to your email.');
          return;
        }

        setSignUpLoading(true);
        try {
          const res = await fetch('/api/auth/verify-signup-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: signUpEmail.trim(),
              otp: cleanOtp,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            setSignUpError(data.error || 'Verification failed. Please check the code and try again.');
            return;
          }

          setMfaTempToken(data.tempToken);
          setMfaFactorId(data.factorId);
          setMfaQrCode(data.qrCode || '');
          setMfaSecret(data.secret || '');
          if (data.user) setPendingUser(data.user);

          setSignUpStep('mfa_enroll');
        } catch (err) {
          setSignUpError('Network error validating code. Please try again.');
        } finally {
          setSignUpLoading(false);
        }
      };

      const handleCompleteMfaSetup = async (e) => {
        if (e) e.preventDefault();
        setMfaError('');
        const cleanCode = mfaTotpCode.trim().replace(/\D/g, '');
        if (!cleanCode || cleanCode.length !== 6) {
          setMfaError('Please enter the 6-digit code from Microsoft Authenticator.');
          return;
        }

        setMfaLoading(true);
        try {
          const res = await fetch('/api/auth/mfa/verify', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${mfaTempToken}`,
            },
            body: JSON.stringify({
              factorId: mfaFactorId,
              code: cleanCode,
            }),
          });

          const data = await res.json();
          if (!res.ok) {
            setMfaError(data.error || 'Invalid authenticator code. Please check Microsoft Authenticator.');
            return;
          }

          const verifiedUser = data.user || pendingUser || {
            id: 'operator',
            email: signUpEmail.trim(),
          };

          localStorage.setItem('applywizz_auth_token', data.token);
          localStorage.setItem('applywizz_auth_user', JSON.stringify(verifiedUser));
          if (data.isAdmin) {
            localStorage.setItem('applywizz_is_admin', 'true');
          } else {
            localStorage.removeItem('applywizz_is_admin');
          }
          if (data.workHistoryUnreachable) {
            localStorage.setItem('applywizz_wh_unreachable', 'true');
          } else {
            localStorage.removeItem('applywizz_wh_unreachable');
          }
          onAuthSuccess(verifiedUser);
        } catch (err) {
          setMfaError('Network error activating Microsoft Authenticator.');
        } finally {
          setMfaLoading(false);
        }
      };

      const handleSignIn = async (e) => {
        if (e) e.preventDefault();
        setSignInError('');
        setSignInSuccessMsg('');
        const trimmedEmail = signInEmail.trim();
        if (!trimmedEmail || !trimmedEmail.includes('@')) {
          setSignInError('Please enter your email address.');
          return;
        }

        const cleanCode = signInTotpCode.trim().replace(/\D/g, '');

        if (signInStep === 'prompt' && (!cleanCode || cleanCode.length < 6)) {
          setSignInLoading(true);
          try {
            const res = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: trimmedEmail }),
            });
            const data = await res.json();
            if (!res.ok) {
              setSignInError(data.error || 'Sign in failed.');
              return;
            }

            if (data.mfaRequired) {
              setSignInStep('verify');
              return;
            }
          } catch (err) {
            setSignInError('Network error. Please try again.');
          } finally {
            setSignInLoading(false);
          }
          return;
        }

        if (cleanCode.length !== 6) {
          setSignInError('Please enter the 6-digit code from Microsoft Authenticator.');
          return;
        }

        setSignInLoading(true);
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: trimmedEmail,
              code: cleanCode,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            setSignInError(data.error || 'Invalid authenticator code. Please check your app.');
            return;
          }

          localStorage.setItem('applywizz_auth_token', data.token);
          localStorage.setItem('applywizz_auth_user', JSON.stringify(data.user));
          if (data.isAdmin) {
            localStorage.setItem('applywizz_is_admin', 'true');
          } else {
            localStorage.removeItem('applywizz_is_admin');
          }
          if (data.workHistoryUnreachable) {
            localStorage.setItem('applywizz_wh_unreachable', 'true');
          } else {
            localStorage.removeItem('applywizz_wh_unreachable');
          }
          onAuthSuccess(data.user);
        } catch (err) {
          setSignInError('Network error during sign in.');
        } finally {
          setSignInLoading(false);
        }
      };

      if (signUpStep === 'mfa_enroll') {
        return (
          <div className="w-full max-w-md bg-white border-2 border-[#1A1A2E] rounded-2xl shadow-[6px_6px_0px_#1A1A2E] p-8">
            <div className="flex items-center justify-center gap-3 mb-6">
              <div className="w-10 h-10 rounded-full bg-[#1A1A2E] text-[#FFF5EB] flex items-center justify-center font-black text-base border-2 border-[#1A1A2E] shadow-[2px_2px_0px_#E88474]">
                AW
              </div>
              <div>
                <h1 className="text-xl font-black text-[#1A1A2E] tracking-tight uppercase">ApplyWizz</h1>
                <span className="text-[11px] block font-mono text-[#64748B] font-bold tracking-wider">
                  Setup Microsoft Authenticator
                </span>
              </div>
            </div>

            <div className="space-y-4">
