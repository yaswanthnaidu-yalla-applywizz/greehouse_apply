<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplyWizz Auto Apply Platform — Operator Dashboard (V2)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            page: '#FFF5EB',
            coral: '#E88474',
            dark: '#1A1A2E',
            card: '#FFFFFF',
            'metric-yellow': '#F4D66B',
            'metric-yellow-text': '#5C4A0A',
            'metric-coral': '#E88474',
            'metric-coral-text': '#6B2C2C',
            'metric-green': '#9AC89A',
            'metric-green-text': '#1E4620',
            'metric-blue': '#B8D4E8',
            'metric-blue-text': '#1E3A5F',
            supabase: '#10B981',
            ai: '#8B5CF6',
            manual: '#F59E0B',
            unresolved: '#EF4444'
          }
        }
      }
    }
  </script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbars */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #FFF5EB;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1A1A2E;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #E88474;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.15s ease-out forwards;
    }
  </style>
</head>
<body class="bg-[#FFF5EB] text-[#1A1A2E] antialiased overflow-hidden select-none font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const API_BASE_URL = window.location.origin;

    // -------------------------------------------------------------
    // Difficulty Badge Component
    // -------------------------------------------------------------
    function DifficultyBadge({ fieldsCount, level, className = '' }) {
      let resolvedLevel = level;
      if (!resolvedLevel) {
        if (fieldsCount === undefined || fieldsCount === null) resolvedLevel = 'Easy';
        else if (fieldsCount < 10) resolvedLevel = 'Easy';
        else if (fieldsCount <= 18) resolvedLevel = 'Medium';
        else resolvedLevel = 'Hard';
      }

      if (resolvedLevel === 'Easy') {
        return (
          <span className={`inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-[#9AC89A] text-[#1E4620] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
            Easy
          </span>
        );
      }

      if (resolvedLevel === 'Medium') {
        return (
          <span className={`inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-[#B8D4E8] text-[#1E3A5F] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
            Medium
          </span>
        );
      }

      return (
        <span className={`inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-[#E88474] text-white border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
          Hard
        </span>
      );
    }

    // -------------------------------------------------------------
    // Source Attribution Badge Component
    // -------------------------------------------------------------
    function SourceBadge({ source, confidence, isEdited }) {
      const activeSource = isEdited ? 'manual' : source;

      if (activeSource === 'manual') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#FEF3C7] text-[#92400E] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#D97706]"></span>
            <span>manual</span>
          </span>
        );
      }

      if (activeSource === 'unresolved') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#FEE2E2] text-[#991B1B] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#EF4444] animate-pulse"></span>
            <span>unresolved</span>
          </span>
        );
      }

      if (activeSource === 'supabase') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#D1FAE5] text-[#065F46] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#10B981]"></span>
            <span>supabase</span>
            {confidence !== undefined && (
              <span className="text-[10px] text-[#047857]">({(confidence * 100).toFixed(0)}%)</span>
            )}
          </span>
        );
      }

      if (activeSource === 'resume_parse') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#CFFAFE] text-[#155E75] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#06B6D4]"></span>
            <span>resume</span>
          </span>
        );
      }

      if (activeSource === 'fuzzy_match') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#DBEAFE] text-[#1E40AF] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#3B82F6]"></span>
            <span>fuzzy</span>
          </span>
        );
      }

      if (activeSource === 'api') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#E0E7FF] text-[#3730A3] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
            <span className="w-1.5 h-1.5 rounded-full bg-[#6366F1]"></span>
            <span>api</span>
          </span>
        );
      }

      return (
        <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold font-mono bg-[#EDE9FE] text-[#5B21B6] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E]">
          <span className="w-1.5 h-1.5 rounded-full bg-[#8B5CF6]"></span>
          <span>ai</span>
        </span>
      );
    }

    // -------------------------------------------------------------
    // Application Status Badge Component
    // -------------------------------------------------------------
    function ApplicationStatusBadge({ status, applicationId, onStatusChange, className = '' }) {
      const statusRef = useRef(status);
      statusRef.current = status;

      useEffect(() => {
        if (status !== 'APPLYING' || !applicationId) return;

        const pollInterval = setInterval(async () => {
          try {
            const url = `/api/applications/${encodeURIComponent(applicationId)}`;
            const res = await fetch(url);
            if (res.ok) {
              const appData = await res.json();
              if (appData.status && appData.status !== statusRef.current) {
                if (onStatusChange) {
                  onStatusChange(appData.status, appData);
                }
              }
            }
          } catch (err) {
            console.warn('Polling error:', err);
          }
        }, 2000);

        return () => clearInterval(pollInterval);
      }, [status, applicationId, onStatusChange]);

      switch (status) {
        case 'APPLIED':
          return (
            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#9AC89A] text-[#1E4620] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
              <span className="w-2 h-2 rounded-full bg-[#1E4620]"></span>
              <span>Applied &amp; Verified</span>
            </span>
          );
        case 'APPLYING':
          return (
            <span className={`inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#E88474] text-white border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] animate-pulse ${className}`}>
              <span className="w-2 h-2 rounded-full border-2 border-white border-t-transparent animate-spin"></span>
              <span>Submitting... (Live)</span>
            </span>
          );
        case 'DRY_RUN_COMPLETE':
          return (
            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#B8D4E8] text-[#1E3A5F] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
              <span className="w-2 h-2 rounded-full bg-[#1E3A5F]"></span>
              <span>Dry-Run Complete</span>
            </span>
          );
        case 'CAPTCHA_REQUIRED':
          return (
            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#F59E0B] text-white border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
              <span>🛡️</span>
              <span>CAPTCHA Required</span>
            </span>
          );
        case 'FAILED':
          return (
            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#EF4444] text-white border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
              <span className="w-2 h-2 rounded-full bg-white"></span>
              <span>Submission Failed</span>
            </span>
          );
        case 'EXPIRED':
          return (
            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#E2E8F0] text-[#475569] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
              <span>Closed / Expired</span>
            </span>
          );
        case 'READY_FOR_REVIEW':
        default:
          return (
            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold font-mono bg-[#F4D66B] text-[#5C4A0A] border border-[#1A1A2E] shadow-[1px_1px_0px_#1A1A2E] ${className}`}>
              <span className="w-2 h-2 rounded-full bg-[#5C4A0A]"></span>
              <span>Ready for Review</span>
            </span>
          );
      }
    }

    // -------------------------------------------------------------
    // Submission Controls Component
    // -------------------------------------------------------------
    function SubmissionControls({
      applicationId,
      status,
      unresolvedFieldsCount,
      proofWebUrl,
      dryRunScreenshotUrl,
      isSubmitting = false,
      isDryRunning = false,
      onTriggerDryRun,
      onTriggerSubmit,
      onResumeCaptcha,
      onViewProof,
      onViewDryRun,
    }) {
      const hasUnresolved = unresolvedFieldsCount > 0;
      const isApplying = status === 'APPLYING' || isSubmitting;
      const isApplied = status === 'APPLIED';
      const isCaptcha = status === 'CAPTCHA_REQUIRED';

      const canSubmit = !hasUnresolved && !isApplying && (status === 'READY_FOR_REVIEW' || status === 'DRY_RUN_COMPLETE' || status === 'FAILED');
      const canDryRun = !isApplying && !isDryRunning;

      return (
        <div className="flex items-center gap-2.5 flex-wrap">
          {isCaptcha && onResumeCaptcha && (
            <button
              type="button"
              onClick={onResumeCaptcha}
              className="inline-flex items-center gap-1.5 px-4 py-2 rounded-md text-xs font-bold text-white bg-[#F59E0B] hover:bg-[#D97706] border border-[#1A1A2E] shadow-[2px_2px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px] transition-all animate-bounce"
            >
              <span>🔓</span>
              <span>I Solved CAPTCHA — Resume Submission</span>
            </button>
          )}

          <button
            type="button"
            onClick={onTriggerDryRun}
            disabled={!canDryRun}
            className={`inline-flex items-center gap-1.5 px-3.5 py-2 rounded-md text-xs font-bold font-mono transition-all ${
              canDryRun
                ? 'bg-[#B8D4E8] hover:bg-[#A3C7DF] text-[#1A1A2E] border border-[#1A1A2E] shadow-[2px_2px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px]'
                : 'bg-[#E2E8F0] text-[#94A3B8] border border-[#CBD5E1] cursor-not-allowed'
            }`}
          >
            {isDryRunning ? (
              <>
                <span className="w-2.5 h-2.5 border-2 border-[#1A1A2E] border-t-transparent rounded-full animate-spin"></span>
                <span>Dry-Running...</span>
              </>
            ) : (
              <>
                <span>🎬</span>
                <span>Dry-Run (Preview)</span>
              </>
            )}
          </button>

          <button
            type="button"
            onClick={onTriggerSubmit}
            disabled={!canSubmit}
            className={`inline-flex items-center gap-1.5 px-4 py-2 rounded-md text-xs font-bold font-mono transition-all ${
              canSubmit
                ? 'bg-[#E88474] hover:bg-[#D67161] text-white border border-[#1A1A2E] shadow-[2px_2px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px]'
                : 'bg-[#E2E8F0] text-[#94A3B8] border border-[#CBD5E1] cursor-not-allowed'
            }`}
          >
            {isApplying ? (
              <>
                <span className="w-2.5 h-2.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                <span>Submitting...</span>
              </>
            ) : isApplied ? (
              <>
                <span>✅</span>
                <span>Applied &amp; Verified</span>
              </>
            )} : (
              <>
                <span>🚀</span>
                <span>Approve &amp; Submit</span>
              </>
            )}
          </button>

          {dryRunScreenshotUrl && onViewDryRun && (
            <button
              type="button"
              onClick={onViewDryRun}
              className="inline-flex items-center gap-1.5 px-3 py-2 rounded-md text-xs font-bold text-[#1A1A2E] bg-white hover:bg-[#FAF4EB] border border-[#1A1A2E] shadow-[2px_2px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px] transition-all font-mono"
            >
              <span>🖼️</span>
              <span>Dry-Run Screenshot</span>
            </button>
          )}

          {(proofWebUrl || isApplied) && onViewProof && (
            <button
              type="button"
              onClick={onViewProof}
              className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-md text-xs font-bold text-[#1E4620] bg-[#9AC89A] hover:bg-[#88B888] border border-[#1A1A2E] shadow-[2px_2px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px] transition-all font-mono"
            >
              <span>📸</span>
              <span>View Web Proof</span>
            </button>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // Editable Form Field Component
    // -------------------------------------------------------------
    function EditableFormField({ field, applicationId, onFieldUpdate }) {
      const [isEditing, setIsEditing] = useState(false);
      const [value, setValue] = useState(field.value || '');
      const [isSaving, setIsSaving] = useState(false);
      const [error, setError] = useState(null);
      const inputRef = useRef(null);

      useEffect(() => {
        setValue(field.value || '');
      }, [field.value]);

      useEffect(() => {
        if (isEditing && inputRef.current) {
          inputRef.current.focus();
        }
      }, [isEditing]);

      const handleSave = async () => {
        if (value === field.value && !error) {
          setIsEditing(false);
          return;
        }

        setIsSaving(true);
        setError(null);

        try {
          const response = await fetch(
            `/api/applications/${encodeURIComponent(applicationId)}/fields/${encodeURIComponent(field.fieldId)}`,
            {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ value }),
            }
          );

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || `HTTP error ${response.status}`);
          }

          const updatedField = await response.json();
          setIsEditing(false);
          if (onFieldUpdate) {
            onFieldUpdate(updatedField);
          }
        } catch (err) {
          console.error('Failed to update field:', err);
          setError(err.message || 'Failed to save');
        } finally {
          setIsSaving(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Escape') {
          setValue(field.value || '');
          setError(null);
          setIsEditing(false);
        } else if (e.key === 'Enter' && field.type !== 'textarea') {
          e.preventDefault();
          handleSave();
        }
      };

      const isTextarea = field.type === 'textarea';
      const isUnresolved = field.source === 'unresolved';

      return (
        <div
          className={`group relative p-3.5 rounded-lg bg-white transition-all ${
            isUnresolved
              ? 'border-2 border-[#EF4444] shadow-[2px_2px_0px_#EF4444]'
              : 'border border-[#1A1A2E] shadow-[2px_2px_0px_#1A1A2E]'
          }`}
        >
          <div className="flex items-start justify-between gap-3 mb-1.5">
            <div className="flex-1">
              <label className="text-xs font-bold text-[#1A1A2E] flex items-center gap-1.5">
                <span>{field.label}</span>
                {field.isRequired && <span className="text-[#EF4444] font-bold">*</span>}
                <span className="text-[10px] font-mono text-[#64748B] font-normal">({field.type})</span>
              </label>
            </div>

            <div className="flex items-center gap-2 shrink-0">
              <SourceBadge
                source={field.source}
                confidence={field.confidence}
                isEdited={field.isEdited}
              />
              {!isEditing && (
                <button
                  type="button"
                  onClick={() => setIsEditing(true)}
                  title="Click to edit field value"
                  className="opacity-60 group-hover:opacity-100 p-1 text-[#1A1A2E] hover:bg-[#FAF4EB] border border-transparent hover:border-[#1A1A2E] rounded transition text-xs"
                >
                  ✏️
                </button>
              )}
            </div>
          </div>

          {isEditing ? (
            <div className="relative mt-1">
              {isTextarea ? (
                <textarea
                  ref={inputRef}
                  value={value}
                  onChange={(e) => setValue(e.target.value)}
                  onBlur={handleSave}
                  onKeyDown={handleKeyDown}
                  disabled={isSaving}
                  rows={3}
                  className="w-full text-xs font-mono p-2.5 bg-[#FFFDF9] border-2 border-[#1A1A2E] rounded-md focus:outline-none focus:ring-2 focus:ring-[#E88474] transition text-[#1A1A2E]"
                />
              ) : (
                <input
                  ref={inputRef}
                  type="text"
                  value={value}
                  onChange={(e) => setValue(e.target.value)}
                  onBlur={handleSave}
                  onKeyDown={handleKeyDown}
                  disabled={isSaving}
                  className="w-full text-xs font-mono p-2 bg-[#FFFDF9] border-2 border-[#1A1A2E] rounded-md focus:outline-none focus:ring-2 focus:ring-[#E88474] transition text-[#1A1A2E]"
                />
              )}
              <div className="flex items-center justify-between mt-1 text-[10px] text-[#64748B] font-mono">
                <span>Press Enter to save, Esc to cancel</span>
                {isSaving && <span className="text-[#D97706] font-bold animate-pulse">Saving...</span>}
                {error && <span className="text-[#EF4444] font-bold">{error}</span>}
              </div>
            </div>
          ) : (
            <div
              onClick={() => setIsEditing(true)}
              title="Click to edit answer"
              className="mt-1 p-2 rounded-md bg-[#FAF4EB] border border-[#1A1A2E] hover:bg-[#F5ECE0] cursor-pointer transition text-xs font-mono break-words"
            >
              {field.value && field.value.trim().length > 0 ? (
                <span className="text-[#1A1A2E] font-medium">{field.value}</span>
              ) : (
                <span className="text-[#EF4444] font-bold italic">⚠️ Unresolved field (click to provide answer)</span>
              )}
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // Proof Viewer Modal Component
    // -------------------------------------------------------------
    function ProofViewer({ isOpen, onClose, screenshotUrl, title = 'Application Verification Proof', metadata = {} }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        if (isOpen) {
          window.addEventListener('keydown', handleKeyDown);
          document.body.style.overflow = 'hidden';
        }
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = 'unset';
        };
      }, [isOpen, onClose]);

      if (!isOpen || !screenshotUrl) return null;

      const handleDownload = () => {
        const link = document.createElement('a');
        link.href = screenshotUrl;
        link.download = `${metadata.applywizzId || 'candidate'}_${metadata.companyName || 'proof'}_verification.png`;
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const formattedDate = metadata.capturedAt
        ? new Date(metadata.capturedAt).toLocaleString()
        : 'Recently captured';

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#1A1A2E]/80 backdrop-blur-sm animate-fadeIn"
          onClick={onClose}
        >
          <div
            className="relative flex flex-col w-full max-w-5xl max-h-[90vh] bg-white rounded-xl shadow-[8px_8px_0px_#1A1A2E] border-2 border-[#1A1A2E] overflow-hidden text-[#1A1A2E]"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between px-6 py-4 border-b-2 border-[#1A1A2E] bg-[#FAF4EB]">
              <div className="flex items-center gap-3">
                <span className="text-2xl">📸</span>
                <div>
                  <h2 className="text-base font-bold text-[#1A1A2E]">{title}</h2>
                  <p className="text-xs font-mono text-[#64748B]">
                    {metadata.companyName ? `${metadata.companyName} — ` : ''}
                    {metadata.jobTitle || 'Greenhouse Application'}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {metadata.status && <ApplicationStatusBadge status={metadata.status} />}
                <button
                  type="button"
                  onClick={handleDownload}

    // -------------------------------------------------------------
    // Candidate Directory (Left Sidebar) Component
    // -------------------------------------------------------------
    function CandidateList({ candidates, selectedId, onSelectCandidate, isLoading }) {
      const [searchTerm, setSearchTerm] = useState('');

      const filteredCandidates = useMemo(() => {
        const query = searchTerm.toLowerCase().trim();
        if (!query) return candidates;
        return candidates.filter(
          (c) =>
            c.clientName.toLowerCase().includes(query) ||
            c.applywizzId.toLowerCase().includes(query) ||
            c.email.toLowerCase().includes(query)
        );
      }, [candidates, searchTerm]);

      return (
        <aside className="w-80 flex-shrink-0 bg-[#FAF4EB] border-r-2 border-[#1A1A2E] flex flex-col h-full overflow-hidden text-[#1A1A2E]">
          <div className="p-4 border-b-2 border-[#1A1A2E] bg-[#FFF5EB] sticky top-0 z-10">
            <div className="flex items-center justify-between mb-2.5">
              <div className="flex items-center gap-1.5">
                <span className="text-sm">👥</span>
                <h2 className="text-xs font-bold uppercase tracking-wider text-[#1A1A2E]">
                  Candidates Directory
                </h2>
              </div>
              <span className="text-xs font-mono bg-white text-[#1A1A2E] border border-[#1A1A2E] px-2 py-0.5 rounded shadow-[1px_1px_0px_#1A1A2E] font-bold">
                {filteredCandidates.length} / {candidates.length}
              </span>
            </div>

            <div className="relative">
              <input
                type="text"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                placeholder="🔍 Search name or AWL-ID..."
                className="w-full bg-white border-2 border-[#1A1A2E] rounded-md px-3 py-2 text-xs text-[#1A1A2E] placeholder-[#64748B] focus:outline-none focus:ring-2 focus:ring-[#E88474] transition-all font-medium shadow-[1px_1px_0px_#1A1A2E]"
              />
              {searchTerm && (
                <button
                  type="button"
                  onClick={() => setSearchTerm('')}
                  className="absolute right-2.5 top-2.5 text-[#64748B] hover:text-[#1A1A2E] text-xs font-bold"
                >
                  ✕
                </button>
              )}
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-3 space-y-2.5 custom-scrollbar">
            {isLoading ? (
              <div className="p-6 text-center text-xs text-[#64748B] font-mono animate-pulse">
                Loading candidate records...
              </div>
            ) : filteredCandidates.length === 0 ? (
              <div className="p-6 text-center text-xs text-[#64748B]">
                No candidates matching <span className="font-bold text-[#1A1A2E]">"{searchTerm}"</span>
              </div>
            ) : (
              filteredCandidates.map((c) => {
                const isSelected = c.applywizzId === selectedId;
                const initials = c.clientName
                  ? c.clientName.split(' ').map((n) => n[0]).join('').toUpperCase().slice(0, 2)
                  : 'AW';

                return (
                  <button
                    key={c.applywizzId}
                    type="button"
                    onClick={() => onSelectCandidate(c.applywizzId)}
                    className={`w-full text-left p-3 rounded-lg transition-all duration-150 relative ${
                      isSelected
                        ? 'bg-[#FFF5EB] border-2 border-[#1A1A2E] shadow-[3px_3px_0px_#1A1A2E] ring-1 ring-[#1A1A2E]'
                        : 'bg-white border border-[#1A1A2E] hover:bg-[#FFFDF9] shadow-[2px_2px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px]'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-1.5">
                      <div className="flex items-center gap-2">
                        <span className="w-6 h-6 rounded-full bg-[#B8D4E8] text-[#1E3A5F] border border-[#1A1A2E] flex items-center justify-center text-[10px] font-bold">
                          {initials}
                        </span>
                        <span className="text-[11px] font-mono font-bold text-[#1A1A2E] bg-[#FAF4EB] border border-[#1A1A2E] px-1.5 py-0.5 rounded">
                          {c.applywizzId}
                        </span>
                      </div>

                      {c.status === 'READY' && (
                        <span className="inline-flex items-center gap-1 text-[10px] font-bold text-[#1E4620] bg-[#9AC89A] px-2 py-0.5 rounded border border-[#1A1A2E]">
                          <span className="w-1.5 h-1.5 rounded-full bg-[#1E4620] animate-pulse"></span>
                          Ready
                        </span>
                      )}
                      {c.status === 'PENDING' && (
                        <span className="inline-flex items-center gap-1 text-[10px] font-bold text-[#5C4A0A] bg-[#F4D66B] px-2 py-0.5 rounded border border-[#1A1A2E]">
                          Pending
                        </span>
                      )}
                      {c.status === 'EXPIRED' && (
                        <span className="inline-flex items-center gap-1 text-[10px] font-bold text-[#475569] bg-[#E2E8F0] px-2 py-0.5 rounded border border-[#1A1A2E]">
                          Expired
                        </span>
                      )}
                    </div>

                    <div className="text-xs font-bold text-[#1A1A2E] truncate mb-1">
                      {c.clientName}
                    </div>

                    <div className="flex items-center justify-between text-[11px] text-[#64748B]">
                      <span className="truncate max-w-[130px] font-medium text-[#64748B]">
                        {c.email || c.location || 'Profile Synced'}
                      </span>
                      <span className="bg-[#FAF4EB] border border-[#1A1A2E] text-[#1A1A2E] px-2 py-0.5 rounded text-[10px] font-bold font-mono">
                        {c.totalJobs} {c.totalJobs === 1 ? 'Job' : 'Jobs'}
                      </span>
                    </div>
                  </button>
                );
              })
            )}
          </div>
        </aside>
      );
    }

              <span className="text-xs font-bold uppercase tracking-wider text-[#1A1A2E]">
                Assigned Applications Queue

              <span className="text-[11px] font-mono bg-[#B8D4E8] border border-[#1A1A2E] text-[#1E3A5F] px-2 py-0.5 rounded font-bold shadow-[1px_1px_0px_#1A1A2E]">

    // -------------------------------------------------------------
    // Form Renderer Component
    // -------------------------------------------------------------
    function FormRenderer({ application, isLoading, candidateName, onFieldUpdate, onStatusChange }) {
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isDryRunning, setIsDryRunning] = useState(false);
      const [viewerOpen, setViewerOpen] = useState(false);
      const [viewerImageUrl, setViewerImageUrl] = useState(null);
      const [viewerTitle, setViewerTitle] = useState('Application Proof');

      if (isLoading) {
        return (
          <div className="flex-1 p-12 flex flex-col items-center justify-center text-[#64748B]">
            <div className="w-8 h-8 border-2 border-[#1A1A2E] border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-xs font-mono font-bold text-[#1A1A2E]">Loading application form...</p>
          </div>
        );
      }

      if (!application) {
        return (
          <div className="flex-1 p-12 flex flex-col items-center justify-center text-[#64748B]">
            <div className="text-4xl mb-3">📋</div>
            <p className="text-sm font-bold text-[#1A1A2E]">No Job Selected</p>
            <p className="text-xs text-[#64748B] mt-1 font-medium">
              Select a candidate from the left directory and click a job tab above to review and submit.
            </p>
          </div>
        );
      }

      const fields = application.resolvedFields || application.resolved_fields || [];
      const manualCount = fields.filter((f) => f.isEdited || f.source === 'manual').length;
      const supabaseCount = fields.filter((f) => f.source === 'supabase' && !f.isEdited).length;
      const aiCount = fields.filter((f) => f.source === 'ai' && !f.isEdited).length;
      const unresCount = fields.filter((f) => f.source === 'unresolved').length;
      const currentStatus = application.status || 'READY_FOR_REVIEW';
      const appId = application.id || application.applywizzId || 'app-default';

      const handleTriggerDryRun = async () => {
        setIsDryRunning(true);
        try {
          const res = await fetch(`/api/applications/${encodeURIComponent(appId)}/dry-run`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ headless: false }),
          });
          const data = await res.json();
          if (data.screenshotUrl) {
            setViewerImageUrl(data.screenshotUrl);
            setViewerTitle('Dry-Run Form Verification Screenshot');
            setViewerOpen(true);
          }
          if (onStatusChange) onStatusChange('DRY_RUN_COMPLETE', data);
        } catch (err) {
          console.error('Dry run failed:', err);
          alert(`Dry run failed: ${err.message}`);
        } finally {
          setIsDryRunning(false);
        }
      };

      const handleTriggerSubmit = async () => {
        setIsSubmitting(true);
        if (onStatusChange) onStatusChange('APPLYING');
        try {
          const res = await fetch(`/api/applications/${encodeURIComponent(appId)}/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ headless: true }),
          });
          const data = await res.json();
          if (data.status && onStatusChange) onStatusChange(data.status, data);
          if (data.proofWebUrl) {
            setViewerImageUrl(data.proofWebUrl);
            setViewerTitle('Live Application Confirmation Proof');
            setViewerOpen(true);
          }
        } catch (err) {
          console.error('Submission failed:', err);
          if (onStatusChange) onStatusChange('FAILED', { error: err.message });
          alert(`Submission error: ${err.message}`);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleResumeCaptcha = async () => {
        setIsSubmitting(true);
        if (onStatusChange) onStatusChange('APPLYING');
        try {
          const res = await fetch(`/api/applications/${encodeURIComponent(appId)}/resume-submission`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
          });
          const data = await res.json();
          if (data.status && onStatusChange) onStatusChange(data.status, data);
          if (data.proofWebUrl) {
            setViewerImageUrl(data.proofWebUrl);
            setViewerTitle('Live Application Confirmation Proof');
            setViewerOpen(true);
          }
        } catch (err) {
          console.error('Resume submission error:', err);
          alert(`Resume submission error: ${err.message}`);
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="flex-1 overflow-y-auto p-6 md:p-8 max-w-5xl mx-auto w-full custom-scrollbar">
          <ProofViewer
            isOpen={viewerOpen}
            onClose={() => setViewerOpen(false)}
            screenshotUrl={viewerImageUrl}
            title={viewerTitle}
            metadata={{
              candidateName: candidateName || application.clientName,
              applywizzId: application.applywizzId || application.applywizz_id,
              companyName: application.companyName || application.company_name,
              jobTitle: application.jobTitle || application.job_title,
              jobUrl: application.jobUrl || application.job_url,
              capturedAt: application.proof_captured_at || application.submitted_at || new Date().toISOString(),
              status: currentStatus,
            }}
          />

          <div className="bg-white border-2 border-[#1A1A2E] rounded-xl p-6 mb-6 shadow-[4px_4px_0px_#1A1A2E]">
            <div className="flex flex-col md:flex-row md:items-start justify-between gap-4 border-b-2 border-[#1A1A2E] pb-5 mb-5">
              <div className="flex-1">
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <span className="text-xs font-bold uppercase tracking-wider text-[#1A1A2E]">
                    🏢 {application.companyName || application.company_name || 'Greenhouse Posting'}
                  </span>
                  <span className="text-[#1A1A2E] font-bold">•</span>
                  <span className="text-xs font-mono font-bold text-[#1A1A2E] bg-[#FAF4EB] px-2 py-0.5 rounded border border-[#1A1A2E]">
                    {application.applywizzId || application.applywizz_id}
                  </span>
                  <DifficultyBadge fieldsCount={fields.length} />
                  <ApplicationStatusBadge
                    status={currentStatus}
                    applicationId={appId}
                    onStatusChange={onStatusChange}
                  />
                </div>
                <h1 className="text-xl font-bold text-[#1A1A2E]">
                  {application.jobTitle || application.job_title || 'Application Form'}
                </h1>
                <a
                  href={application.jobUrl || application.job_url}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-xs text-[#2563EB] hover:underline font-mono truncate max-w-lg mt-1 inline-block font-medium"
                >
                  {application.jobUrl || application.job_url}
                </a>
              </div>

              <div className="shrink-0 flex flex-col items-end gap-2">
                <SubmissionControls
                  applicationId={appId}
                  status={currentStatus}
                  unresolvedFieldsCount={unresCount}
                  proofWebUrl={application.proof_web_url || application.proofWebUrl}
                  dryRunScreenshotUrl={application.dry_run_screenshot_url || application.dryRunScreenshotUrl}
                  isSubmitting={isSubmitting}
                  isDryRunning={isDryRunning}
                  onTriggerDryRun={handleTriggerDryRun}
                  onTriggerSubmit={handleTriggerSubmit}
                  onResumeCaptcha={handleResumeCaptcha}
                  onViewProof={() => {
                    const url = application.proof_web_url || application.proofWebUrl;
                    if (url) {
                      setViewerImageUrl(url);
                      setViewerTitle('Live Application Confirmation Proof');
                      setViewerOpen(true);
                    }
                  }}
                  onViewDryRun={() => {
                    const url = application.dry_run_screenshot_url || application.dryRunScreenshotUrl;
                    if (url) {
                      setViewerImageUrl(url);
                      setViewerTitle('Dry-Run Form Verification Screenshot');
                      setViewerOpen(true);
                    }
                  }}
                />
              </div>
            </div>

            <div className="flex flex-wrap items-center justify-between gap-3 bg-[#FAF4EB] border border-[#1A1A2E] rounded-lg px-4 py-2.5 text-xs text-[#1A1A2E]">
              <div className="flex items-center gap-2 font-medium">
                <span>✏️</span>
                <span>Operator Review — Click any field value below to edit answers inline</span>
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                {manualCount > 0 && (
                  <span className="text-[11px] font-mono font-bold text-[#92400E] bg-[#FEF3C7] border border-[#1A1A2E] px-2 py-0.5 rounded shadow-[1px_1px_0px_#1A1A2E]">
                    {manualCount} manual
                  </span>
                )}
                <span className="text-[11px] font-mono font-bold text-[#065F46] bg-[#D1FAE5] border border-[#1A1A2E] px-2 py-0.5 rounded shadow-[1px_1px_0px_#1A1A2E]">
                  {supabaseCount} supabase
                </span>
                <span className="text-[11px] font-mono font-bold text-[#5B21B6] bg-[#EDE9FE] border border-[#1A1A2E] px-2 py-0.5 rounded shadow-[1px_1px_0px_#1A1A2E]">
                  {aiCount} ai
                </span>
                {unresCount > 0 && (
                  <span className="text-[11px] font-mono font-bold text-white bg-[#EF4444] border border-[#1A1A2E] px-2 py-0.5 rounded shadow-[1px_1px_0px_#1A1A2E] animate-pulse">
                    {unresCount} unresolved
                  </span>
                )}
              </div>
            </div>
          </div>

          <div className="space-y-3.5">
            {fields.length === 0 ? (
              <div className="bg-white border-2 border-[#1A1A2E] rounded-xl p-8 text-center text-[#64748B] shadow-[3px_3px_0px_#1A1A2E]">
                <p className="text-sm font-bold text-[#1A1A2E]">No interactive form fields extracted for this job posting.</p>
                {currentStatus === 'EXPIRED' && (
                  <p className="text-xs text-[#EF4444] font-bold mt-1">This job posting appears to be closed or expired.</p>
                )}
              </div>
            ) : (
              fields.map((field, index) => (
                <EditableFormField
                  key={`${field.fieldId}-${index}`}
                  field={field}
                  applicationId={appId}
                  onFieldUpdate={onFieldUpdate}
                />
              ))
            )}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // Main App Component
    // -------------------------------------------------------------
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [candidates, setCandidates] = useState([]);
      const [stats, setStats] = useState(null);
      const [selectedCandidateId, setSelectedCandidateId] = useState(null);
      const [candidateDetail, setCandidateDetail] = useState(null);
      const [selectedJobUrl, setSelectedJobUrl] = useState(null);
      const [application, setApplication] = useState(null);

      const [isLoadingCandidates, setIsLoadingCandidates] = useState(true);
      const [isLoadingApplication, setIsLoadingApplication] = useState(false);

      const fetchInitialData = useCallback(async () => {
        setIsLoadingCandidates(true);
        try {
          const [candidatesRes, statsRes] = await Promise.all([
            fetch('/api/candidates'),
            fetch('/api/stats'),
          ]);

          if (candidatesRes.ok) {
            const candidateData = await candidatesRes.json();
            setCandidates(candidateData);
            if (candidateData.length > 0 && !selectedCandidateId) {
              setSelectedCandidateId(candidateData[0].applywizzId);
            }
          }

          if (statsRes.ok) {
            const statsData = await statsRes.json();
            setStats(statsData);
          }
        } catch (err) {
          console.error('Failed to load initial data:', err);
        } finally {
          setIsLoadingCandidates(false);
        }
      }, [selectedCandidateId]);

      useEffect(() => {
        fetchInitialData();
      }, [fetchInitialData]);

      const fetchCandidateDetail = useCallback(async (applywizzId) => {
        try {
          const res = await fetch(`/api/candidates/${applywizzId}`);
          if (res.ok) {
            const detail = await res.json();
            setCandidateDetail(detail);

            if (detail.jobs && detail.jobs.length > 0) {
              const firstJobUrl = detail.jobs[0].canonicalUrl || detail.jobs[0].rawUrl;
              setSelectedJobUrl(firstJobUrl);
            } else {
              setSelectedJobUrl(null);
              setApplication(null);
            }
          }
        } catch (err) {
          console.error(`Failed to fetch candidate ${applywizzId}:`, err);
        }
      }, []);

      useEffect(() => {
        if (selectedCandidateId) {
          fetchCandidateDetail(selectedCandidateId);
        }
      }, [selectedCandidateId, fetchCandidateDetail]);

      const fetchJobApplication = useCallback(async (applywizzId, jobUrl) => {
        setIsLoadingApplication(true);
        try {
          const encodedUrl = encodeURIComponent(jobUrl);
          const res = await fetch(`/api/candidates/${applywizzId}/jobs/${encodedUrl}`);
          if (res.ok) {
            const appData = await res.json();
            setApplication(appData);
          } else {
            setApplication(null);
          }
        } catch (err) {
          console.error(`Failed to fetch application for ${applywizzId} / ${jobUrl}:`, err);
          setApplication(null);
        } finally {
          setIsLoadingApplication(false);
        }
      }, []);

      useEffect(() => {
        if (selectedCandidateId && selectedJobUrl) {
          fetchJobApplication(selectedCandidateId, selectedJobUrl);
        }
      }, [selectedCandidateId, selectedJobUrl, fetchJobApplication]);

      const handleFieldUpdate = (updatedField) => {
        if (!application) return;
        const fields = application.resolvedFields || application.resolved_fields || [];
        const newResolvedFields = fields.map((f) =>
          f.fieldId === updatedField.fieldId || f.name === updatedField.fieldId ? updatedField : f
        );
        setApplication({
          ...application,
          resolvedFields: newResolvedFields,
          resolved_fields: newResolvedFields,
        });
      };

      const handleStatusChange = (newStatus, updatedPayload) => {
        if (!application) return;
        setApplication((prev) => ({
          ...prev,
          status: newStatus,
          proof_web_url: updatedPayload?.proofWebUrl || updatedPayload?.proof_web_url || prev.proof_web_url,
          proof_captured_at: updatedPayload?.proofCapturedAt || updatedPayload?.proof_captured_at || prev.proof_captured_at,
          dry_run_screenshot_url: updatedPayload?.screenshotUrl || updatedPayload?.dry_run_screenshot_url || prev.dry_run_screenshot_url,
        }));

        if (candidateDetail && selectedJobUrl) {
          const updatedJobs = candidateDetail.jobs.map((j) => {
            if (j.canonicalUrl === selectedJobUrl || j.rawUrl === selectedJobUrl) {
              return { ...j, status: newStatus };
            }
            return j;
          });
          setCandidateDetail({ ...candidateDetail, jobs: updatedJobs });
        }
      };

      return (
        <div className="flex flex-col h-screen w-screen bg-[#FFF5EB] text-[#1A1A2E] font-sans overflow-hidden select-none">
          <header className="h-16 bg-[#FFF5EB] border-b-2 border-[#1A1A2E] flex items-center justify-between px-6 flex-shrink-0">
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full bg-[#1A1A2E] text-[#FFF5EB] flex items-center justify-center font-black text-sm border-2 border-[#1A1A2E] shadow-[2px_2px_0px_#E88474]">
                  AW
                </div>
                <div>
                  <span className="text-sm font-black tracking-tight text-[#1A1A2E] uppercase">
                    ApplyWizz
                  </span>
                  <span className="text-[10px] block font-mono text-[#64748B] font-bold">
                    Auto Apply V2
                  </span>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-2 bg-white border border-[#1A1A2E] rounded-md p-1 shadow-[2px_2px_0px_#1A1A2E]">
                <button
                  type="button"
                  onClick={() => setActiveTab('find-jobs')}
                  className={`px-3 py-1 text-xs font-bold rounded transition-all ${
                    activeTab === 'find-jobs'
                      ? 'bg-[#E88474] text-white'
                      : 'text-[#1A1A2E] hover:bg-[#FAF4EB]'
                  }`}
                >
                  Find Jobs
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-3 py-1 text-xs font-bold rounded transition-all ${
                    activeTab === 'dashboard'
                      ? 'bg-[#E88474] text-white'
                      : 'text-[#1A1A2E] hover:bg-[#FAF4EB]'
                  }`}
                >
                  Dashboard
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab('stats')}
                  className={`px-3 py-1 text-xs font-bold rounded transition-all ${
                    activeTab === 'stats'
                      ? 'bg-[#E88474] text-white'
                      : 'text-[#1A1A2E] hover:bg-[#FAF4EB]'
                  }`}
                >
                  Stats
                </button>
              </nav>
            </div>

            <div className="flex items-center gap-3">
              {stats && (
                <div className="hidden lg:flex items-center gap-2">
                  <div className="flex items-center gap-1.5 bg-[#F4D66B] border border-[#1A1A2E] px-2.5 py-1 rounded text-xs font-mono font-bold text-[#5C4A0A] shadow-[1px_1px_0px_#1A1A2E]">
                    <span>Candidates:</span>
                    <span>{stats.totalCandidates}</span>
                  </div>

                  <div className="flex items-center gap-1.5 bg-[#B8D4E8] border border-[#1A1A2E] px-2.5 py-1 rounded text-xs font-mono font-bold text-[#1E3A5F] shadow-[1px_1px_0px_#1A1A2E]">
                    <span>Jobs:</span>
                    <span>{stats.totalApplications}</span>
                  </div>

                  <div className="flex items-center gap-1.5 bg-[#9AC89A] border border-[#1A1A2E] px-2.5 py-1 rounded text-xs font-mono font-bold text-[#1E4620] shadow-[1px_1px_0px_#1A1A2E]">
                    <span>🌿 supabase: {stats.supabasePercentage}%</span>
                  </div>

                  <div className="flex items-center gap-1.5 bg-[#EDE9FE] border border-[#1A1A2E] px-2.5 py-1 rounded text-xs font-mono font-bold text-[#5B21B6] shadow-[1px_1px_0px_#1A1A2E]">
                    <span>🔮 ai: {stats.aiPercentage}%</span>
                  </div>
                </div>
              )}

              <button
                type="button"
                onClick={fetchInitialData}
                title="Refresh Data"
                className="text-xs bg-white hover:bg-[#FAF4EB] text-[#1A1A2E] border border-[#1A1A2E] px-2.5 py-1 rounded shadow-[2px_2px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px] font-bold transition-all"
              >
                ↻
              </button>

              <div className="relative p-1.5 bg-white border border-[#1A1A2E] rounded shadow-[2px_2px_0px_#1A1A2E] cursor-pointer">
                <span className="text-xs">🔔</span>
                <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-[#E88474] border border-[#1A1A2E] rounded-full"></span>
              </div>

              <div className="flex items-center gap-2 bg-white border border-[#1A1A2E] px-2.5 py-1 rounded shadow-[2px_2px_0px_#1A1A2E]">
                <div className="w-5 h-5 rounded-full bg-[#E88474] border border-[#1A1A2E] flex items-center justify-center text-[10px] font-black text-white">
                  OP
                </div>
                <span className="text-xs font-bold text-[#1A1A2E] hidden sm:inline">Operator</span>
              </div>
            </div>
          </header>

          {activeTab === 'stats' ? (
            <div className="flex-1 overflow-y-auto p-8 max-w-5xl mx-auto w-full custom-scrollbar">
              <div className="mb-6">
                <h2 className="text-2xl font-black text-[#1A1A2E]">Application Pipeline Stats</h2>
                <p className="text-xs text-[#64748B] font-mono mt-0.5">
                  Real-time throughput metrics, resolution tier breakdowns, and submission telemetry.
                </p>
              </div>

              {stats ? (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                  <div className="bg-[#FFF8D6] border-2 border-[#1A1A2E] rounded-xl p-5 shadow-[4px_4px_0px_#1A1A2E]">
                    <span className="text-xs font-bold uppercase tracking-wider text-[#5C4A0A]">
                      Total Candidates
                    </span>
                    <div className="text-3xl font-black text-[#1A1A2E] mt-2">
                      {stats.totalCandidates}
                    </div>
                    <div className="text-[11px] font-mono text-[#5C4A0A] mt-1">
                      Ingested &amp; segregated
                    </div>
                  </div>

                  <div className="bg-[#E2F0FB] border-2 border-[#1A1A2E] rounded-xl p-5 shadow-[4px_4px_0px_#1A1A2E]">
                    <span className="text-xs font-bold uppercase tracking-wider text-[#1E3A5F]">
                      Total Applications
                    </span>
                    <div className="text-3xl font-black text-[#1A1A2E] mt-2">
                      {stats.totalApplications}
                    </div>
                    <div className="text-[11px] font-mono text-[#1E3A5F] mt-1">
                      Active job assignments
                    </div>
                  </div>

                  <div className="bg-[#E2F5E2] border-2 border-[#1A1A2E] rounded-xl p-5 shadow-[4px_4px_0px_#1A1A2E]">
                    <span className="text-xs font-bold uppercase tracking-wider text-[#1E4620]">
                      Supabase Cache
                    </span>
                    <div className="text-3xl font-black text-[#1A1A2E] mt-2">
                      {stats.supabasePercentage}%
                    </div>
                    <div className="text-[11px] font-mono text-[#1E4620] mt-1">
                      {stats.supabaseTaggedCount} fields (0 API calls)
                    </div>
                  </div>

                  <div className="bg-[#FFEAE8] border-2 border-[#1A1A2E] rounded-xl p-5 shadow-[4px_4px_0px_#1A1A2E]">
                    <span className="text-xs font-bold uppercase tracking-wider text-[#6B2C2C]">
                      AI Synthesis
                    </span>
                    <div className="text-3xl font-black text-[#1A1A2E] mt-2">
                      {stats.aiPercentage}%
                    </div>
                    <div className="text-[11px] font-mono text-[#6B2C2C] mt-1">
                      {stats.aiTaggedCount} fields synthesized
                    </div>
                  </div>
                </div>
              ) : (
                <div className="p-8 text-center text-xs font-mono text-[#64748B]">Loading statistics...</div>
              )}
            </div>
          ) : (
            <div className="flex flex-1 overflow-hidden">
              <CandidateList
                candidates={candidates}
                selectedId={selectedCandidateId}
                onSelectCandidate={(id) => setSelectedCandidateId(id)}
                isLoading={isLoadingCandidates}
              />

              <main className="flex-1 flex flex-col bg-[#FFF5EB] overflow-hidden">
                {candidateDetail ? (
                  <>
                    <JobQueueView
                      candidate={candidateDetail}
                      selectedJobUrl={selectedJobUrl}
                      onSelectJob={(url) => setSelectedJobUrl(url)}
                    />
                    <FormRenderer
                      application={application}
                      isLoading={isLoadingApplication}
                      candidateName={candidateDetail.clientName}
                      onFieldUpdate={handleFieldUpdate}
                      onStatusChange={handleStatusChange}
                    />
                  </>
                ) : (
                  <div className="flex-1 flex flex-col items-center justify-center text-[#64748B]">
                    <div className="text-4xl mb-2">👤</div>
                    <p className="text-sm font-bold text-[#1A1A2E]">No Candidate Selected</p>
                    <p className="text-xs text-[#64748B] mt-1 font-medium">
                      Select a candidate from the left directory to view assigned applications.
                    </p>
                  </div>
                )}
              </main>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
