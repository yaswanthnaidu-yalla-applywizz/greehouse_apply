                      </span>
                    </div>
                    <DifficultyBadge fieldsCount={job.fieldsCount} />
                  </div>

                  <div className="text-xs text-[#1A1A2E] font-medium truncate mb-1">
                    {job.jobTitle || 'Job Application'}
                  </div>

                  <div className="flex items-center justify-between text-[10px] mt-1 pt-1 border-t border-[#1A1A2E]/20">
                    <span className="font-mono text-[#64748B]">
                      {job.fieldsCount ? `${job.fieldsCount} Qs` : 'Scanned'}
                    </span>
                    {job.status === 'APPLIED' && (
                      <span className="text-[10px] font-mono text-[#1E4620] font-bold bg-[#9AC89A] border border-[#1A1A2E] px-1.5 py-0.2 rounded">
                        ✅ Applied
                      </span>
                    )}
                    {job.status === 'APPLYING' && (
                      <span className="text-[10px] font-mono text-white font-bold bg-[#E88474] border border-[#1A1A2E] px-1.5 py-0.2 rounded animate-pulse">
                        ⏳ Submitting
                      </span>
                    )}
                    {job.status === 'DRY_RUN_COMPLETE' && (
                      <span className="text-[10px] font-mono text-[#1E3A5F] font-bold bg-[#B8D4E8] border border-[#1A1A2E] px-1.5 py-0.2 rounded">
                        🚀 Dry-Run
                      </span>
                    )}
                    {job.status === 'READY_FOR_REVIEW' && (
                      <span className="text-[10px] font-mono text-[#5C4A0A] font-bold bg-[#F4D66B] border border-[#1A1A2E] px-1.5 py-0.2 rounded">
                        🟡 Ready
                      </span>
                    )}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // Form Renderer Component
    // -------------------------------------------------------------
    function FormRenderer({ application, isLoading, candidateName, onFieldUpdate, onStatusChange }) {
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isDryRunning, setIsDryRunning] = useState(false);
      const [viewerOpen, setViewerOpen] = useState(false);
      const [viewerImageUrl, setViewerImageUrl] = useState(null);
      const [viewerTitle, setViewerTitle] = useState('Application Proof');

      if (isLoading) {
        return (
          <div className="flex-1 p-12 flex flex-col items-center justify-center text-[#64748B]">
            <div className="w-8 h-8 border-2 border-[#1A1A2E] border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-xs font-mono font-bold text-[#1A1A2E]">Loading application form...</p>
          </div>
        );
      }

      if (!application) {
        return (
          <div className="flex-1 p-12 flex flex-col items-center justify-center text-[#64748B]">
            <div className="text-4xl mb-3">📋</div>
            <p className="text-sm font-bold text-[#1A1A2E]">No Job Selected</p>
            <p className="text-xs text-[#64748B] mt-1 font-medium">
              Select a candidate from the left directory and click a job tab above to review and submit.
            </p>
          </div>
        );
      }

      const fields = application.resolvedFields || application.resolved_fields || [];
      const manualCount = fields.filter((f) => f.isEdited || f.source === 'manual').length;
      const supabaseCount = fields.filter((f) => f.source === 'supabase' && !f.isEdited).length;
      const aiCount = fields.filter((f) => f.source === 'ai' && !f.isEdited).length;
      const unresCount = fields.filter(
        (f) => (f.isRequired || f.required) && (!f.value || f.value.trim().length === 0 || f.source === 'unresolved')
      ).length;
      const currentStatus = application.status || 'READY_FOR_REVIEW';
      const appId = application.applywizzId || application.applywizz_id || application.id || 'app-default';
      const jobUrl = application.jobUrl || application.job_url || '';

      const handleTriggerDryRun = async () => {
        setIsDryRunning(true);
        try {
          const res = await fetch(`/api/applications/${encodeURIComponent(appId)}/dry-run`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              headless: false,
              jobUrl: application.jobUrl || application.job_url,
            }),
          });
          const data = await res.json();
          if (data.screenshotUrl) {
            setViewerImageUrl(data.screenshotUrl);
            setViewerTitle('Dry-Run Form Verification Screenshot');
            setViewerOpen(true);
          }
          if (onStatusChange) onStatusChange('DRY_RUN_COMPLETE', data);
        } catch (err) {
          console.error('Dry run failed:', err);
          alert(`Dry run failed: ${err.message}`);
        } finally {
          setIsDryRunning(false);
        }
      };

      const handleTriggerSubmit = async () => {
        setIsSubmitting(true);
        if (onStatusChange) onStatusChange('APPLYING');
        try {
          const res = await fetch(`/api/applications/${encodeURIComponent(appId)}/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              headless: true,
              jobUrl: application.jobUrl || application.job_url,
            }),
          });
          const data = await res.json();
          let proofWebUrl = data.proofWebUrl;
          let proofCapturedAt = data.proofCapturedAt;

          if (data.status === 'APPLIED' && !proofWebUrl) {
            try {
              const proofRes = await fetch(`/api/applications/${encodeURIComponent(appId)}/proof`);
              if (proofRes.ok) {
                const proofData = await proofRes.json();
                proofWebUrl = proofData.proofWebUrl;
                proofCapturedAt = proofData.proofCapturedAt;
              }
            } catch {}
          }

          if (data.status && onStatusChange) {
            onStatusChange(data.status, {
              ...data,
              proofWebUrl,
              proofCapturedAt,
            });
          }

          if (proofWebUrl) {
            setViewerImageUrl(proofWebUrl);
            setViewerTitle('Live Application Confirmation Proof');
            setViewerOpen(true);
          }
        } catch (err) {
          console.error('Submission failed:', err);
          if (onStatusChange) onStatusChange('FAILED', { error: err.message });
          alert(`Submission error: ${err.message}`);
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="flex-1 overflow-y-auto p-6 md:p-8 max-w-5xl mx-auto w-full custom-scrollbar">
          <ProofViewer
            isOpen={viewerOpen}
            onClose={() => setViewerOpen(false)}
            screenshotUrl={viewerImageUrl}
            title={viewerTitle}
            metadata={{
              candidateName: candidateName || application.clientName,
              applywizzId: application.applywizzId || application.applywizz_id,
              companyName: application.companyName || application.company_name,
              jobTitle: application.jobTitle || application.job_title,
              jobUrl: application.jobUrl || application.job_url,
              capturedAt: application.proof_captured_at || application.submitted_at || new Date().toISOString(),
              status: currentStatus,
            }}
          />

          <div className="bg-white border-2 border-[#1A1A2E] rounded-xl p-6 mb-6 shadow-[4px_4px_0px_#1A1A2E]">
            <div className="flex flex-col md:flex-row md:items-start justify-between gap-4 border-b-2 border-[#1A1A2E] pb-5 mb-5">
              <div className="flex-1">
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <span className="text-xs font-bold uppercase tracking-wider text-[#1A1A2E]">
                    🏢 {application.companyName || application.company_name || 'Greenhouse Posting'}
                  </span>
                  <span className="text-[#1A1A2E] font-bold">•</span>
                  <span className="text-xs font-mono font-bold text-[#1A1A2E] bg-[#FAF4EB] px-2 py-0.5 rounded border border-[#1A1A2E]">
                    {application.applywizzId || application.applywizz_id}
                  </span>
                  <DifficultyBadge fieldsCount={fields.length} />
                  <ApplicationStatusBadge
                    status={currentStatus}
                    applicationId={appId}
                    onStatusChange={onStatusChange}
                  />
                </div>
                <h1 className="text-xl font-bold text-[#1A1A2E]">
                  {application.jobTitle || application.job_title || 'Application Form'}
                </h1>
                <a
                  href={application.jobUrl || application.job_url}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-xs text-[#2563EB] hover:underline font-mono truncate max-w-lg mt-1 inline-block font-medium"
                >
                  {application.jobUrl || application.job_url}
                </a>
              </div>

              <div className="shrink-0 flex flex-col items-end gap-2">
                <SubmissionControls
                  applicationId={appId}
                  jobUrl={jobUrl}
                  status={currentStatus}
                  unresolvedFieldsCount={unresCount}
                  proofWebUrl={application.proof_web_url || application.proofWebUrl}
                  proofEmailUrl={application.proof_email_url || application.proofEmailUrl}
                  dryRunScreenshotUrl={application.dry_run_screenshot_url || application.dryRunScreenshotUrl}
                  isSubmitting={isSubmitting}
                  isDryRunning={isDryRunning}
                  onTriggerDryRun={handleTriggerDryRun}
                  onTriggerSubmit={handleTriggerSubmit}
                  onStatusChange={onStatusChange}
                  onOtpVerified={({ proofWebUrl }) => {
                    if (proofWebUrl) {
                      setViewerImageUrl(proofWebUrl);
                      setViewerTitle('Live Application Confirmation Proof');
                      setViewerOpen(true);
                    }
                  }}
                  onViewProof={() => {
                    const url = application.proof_web_url || application.proofWebUrl;
                    if (url) {
                      setViewerImageUrl(url);
                      setViewerTitle('Live Application Confirmation Proof');
                      setViewerOpen(true);
                    }
                  }}
                  onViewEmailProof={() => {
                    const url = application.proof_email_url || application.proofEmailUrl;
                    if (url) {
                      setViewerImageUrl(url);
                      setViewerTitle('Zoho Confirmation Email Proof');
                      setViewerOpen(true);
                    }
                  }}
                  onViewDryRun={() => {
                    const url = application.dry_run_screenshot_url || application.dryRunScreenshotUrl;
                    if (url) {
                      setViewerImageUrl(url);
                      setViewerTitle('Dry-Run Form Verification Screenshot');
                      setViewerOpen(true);
                    }
                  }}
                />
              </div>
            </div>

            <div className="flex flex-wrap items-center justify-between gap-3 bg-[#FAF4EB] border border-[#1A1A2E] rounded-lg px-4 py-2.5 text-xs text-[#1A1A2E]">
              <div className="flex items-center gap-2 font-medium">
                <span>✏️</span>
                <span>Operator Review — Click any field value below to edit answers inline</span>
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                {manualCount > 0 && (
                  <span className="text-[11px] font-mono font-bold text-[#92400E] bg-[#FEF3C7] border border-[#1A1A2E] px-2 py-0.5 rounded shadow-[1px_1px_0px_#1A1A2E]">
                    {manualCount} manual
                  </span>
                )}
                <span className="text-[11px] font-mono font-bold text-[#065F46] bg-[#D1FAE5] border border-[#1A1A2E] px-2 py-0.5 rounded shadow-[1px_1px_0px_#1A1A2E]">
                  {supabaseCount} supabase
                </span>
                <span className="text-[11px] font-mono font-bold text-[#5B21B6] bg-[#EDE9FE] border border-[#1A1A2E] px-2 py-0.5 rounded shadow-[1px_1px_0px_#1A1A2E]">
                  {aiCount} ai
                </span>
                {unresCount > 0 && (
                  <span className="text-[11px] font-mono font-bold text-white bg-[#EF4444] border border-[#1A1A2E] px-2 py-0.5 rounded shadow-[1px_1px_0px_#1A1A2E] animate-pulse">
                    {unresCount} unresolved
                  </span>
                )}
              </div>
            </div>
          </div>

          <div className="space-y-3.5">
            {fields.length === 0 ? (
              <div className="bg-white border-2 border-[#1A1A2E] rounded-xl p-8 text-center text-[#64748B] shadow-[3px_3px_0px_#1A1A2E]">
                <p className="text-sm font-bold text-[#1A1A2E]">No interactive form fields extracted for this job posting.</p>
                {currentStatus === 'EXPIRED' && (
                  <p className="text-xs text-[#EF4444] font-bold mt-1">This job posting appears to be closed or expired.</p>
                )}
              </div>
            ) : (
              fields.map((field, index) => (
                <EditableFormField
                  key={`${field.fieldId}-${index}`}
                  field={field}
                  applicationId={appId}
                  onFieldUpdate={onFieldUpdate}
                />
              ))
            )}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // AuthView Component (Sign In & Sign Up)
    // -------------------------------------------------------------
    function AuthView({ onAuthSuccess }) {
      const [tab, setTab] = useState('signin'); // 'signin' | 'signup'

      // Sign In state
      const [signInEmail, setSignInEmail] = useState('');
      const [signInPassword, setSignInPassword] = useState('');
      const [signInLoading, setSignInLoading] = useState(false);
      const [signInError, setSignInError] = useState('');
      const [signInSuccessMsg, setSignInSuccessMsg] = useState('');

      // Sign Up state
      const [signUpEmail, setSignUpEmail] = useState('');
      const [isEmailVerified, setIsEmailVerified] = useState(false);
      const [verifyLoading, setVerifyLoading] = useState(false);
      const [signUpError, setSignUpError] = useState('');
      const [signUpPassword, setSignUpPassword] = useState('');
      const [signUpConfirmPassword, setSignUpConfirmPassword] = useState('');
      const [registerLoading, setRegisterLoading] = useState(false);

      const handleVerifyEmail = async (e) => {
        if (e) e.preventDefault();
        setSignUpError('');
        const trimmed = signUpEmail.trim();
        if (!trimmed || !trimmed.includes('@')) {
          setSignUpError('Please enter a valid email address.');
          return;
        }

        setVerifyLoading(true);
        try {
          const res = await fetch('/api/auth/verify-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: trimmed }),
          });
          const data = await res.json();
          if (!res.ok) {
            setSignUpError(data.error || 'Email authorization check failed.');
            return;
          }
          setIsEmailVerified(true);
        } catch (err) {
          setSignUpError('Network error checking email. Please try again.');
        } finally {
          setVerifyLoading(false);
        }
      };

      const handleRegister = async (e) => {
        if (e) e.preventDefault();
        setSignUpError('');
        if (!signUpPassword || signUpPassword.length < 6) {
          setSignUpError('Password must be at least 6 characters long.');
          return;
        }
        if (signUpPassword !== signUpConfirmPassword) {
          setSignUpError('Passwords do not match.');
          return;
        }

        setRegisterLoading(true);
        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: signUpEmail.trim(),
              password: signUpPassword,
              confirmPassword: signUpConfirmPassword,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            setSignUpError(data.error || 'Registration failed.');
            return;
          }

          // Transition to Sign In tab
          setSignInEmail(signUpEmail.trim());
          setSignInPassword('');
          setSignInError('');
          setSignInSuccessMsg('Account created successfully! Please sign in with your password.');
          setTab('signin');
          setIsEmailVerified(false);
          setSignUpPassword('');
          setSignUpConfirmPassword('');
        } catch (err) {
          setSignUpError('Network error during registration.');
        } finally {
          setRegisterLoading(false);
        }
      };

      const handleSignIn = async (e) => {
        if (e) e.preventDefault();
        setSignInError('');
        setSignInSuccessMsg('');
        const trimmedEmail = signInEmail.trim();
        if (!trimmedEmail || !signInPassword) {
          setSignInError('Please enter both email and password.');
          return;
        }

        setSignInLoading(true);
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: trimmedEmail,
              password: signInPassword,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            setSignInError(data.error || 'Invalid email or password.');
            return;
          }

          localStorage.setItem('applywizz_auth_token', data.token);
          localStorage.setItem('applywizz_auth_user', JSON.stringify(data.user));
          onAuthSuccess(data.user);
        } catch (err) {
          setSignInError('Network error during sign in.');
        } finally {
          setSignInLoading(false);
        }
      };

      return (
        <div className="w-full max-w-md bg-white border-2 border-[#1A1A2E] rounded-2xl shadow-[6px_6px_0px_#1A1A2E] p-8">
          <div className="flex items-center justify-center gap-3 mb-6">
            <div className="w-10 h-10 rounded-full bg-[#1A1A2E] text-[#FFF5EB] flex items-center justify-center font-black text-base border-2 border-[#1A1A2E] shadow-[2px_2px_0px_#E88474]">
              AW
            </div>
            <div>
              <h1 className="text-xl font-black text-[#1A1A2E] tracking-tight uppercase">ApplyWizz</h1>
              <span className="text-[11px] block font-mono text-[#64748B] font-bold tracking-wider">
                Operator Portal
              </span>
            </div>
          </div>

          <div className="flex border-2 border-[#1A1A2E] rounded-xl p-1 bg-[#FAF4EB] mb-6 shadow-[2px_2px_0px_#1A1A2E]">
            <button
              type="button"
              onClick={() => {
                setTab('signin');
                setSignInError('');
                setSignUpError('');
              }}
              className={`flex-1 py-2 text-xs font-black rounded-lg transition-all ${
                tab === 'signin'
                  ? 'bg-[#E88474] text-white shadow-[1px_1px_0px_#1A1A2E]'
                  : 'text-[#1A1A2E] hover:bg-[#FFF5EB]'
              }`}
            >
              Sign In
            </button>
            <button
              type="button"
              onClick={() => {
                setTab('signup');
                setSignInError('');
                setSignUpError('');
                setSignInSuccessMsg('');
              }}
              className={`flex-1 py-2 text-xs font-black rounded-lg transition-all ${
                tab === 'signup'
                  ? 'bg-[#E88474] text-white shadow-[1px_1px_0px_#1A1A2E]'
                  : 'text-[#1A1A2E] hover:bg-[#FFF5EB]'
              }`}
            >
              Sign Up
            </button>
          </div>

          {tab === 'signin' ? (
            <form onSubmit={handleSignIn} className="space-y-4">
              {signInSuccessMsg && (
                <div className="bg-[#9AC89A]/30 border-2 border-[#1A1A2E] text-[#1E4620] text-xs font-bold p-3 rounded-xl shadow-[2px_2px_0px_#1A1A2E] flex items-start gap-2">
                  <span className="text-sm">✓</span>
                  <span>{signInSuccessMsg}</span>
                </div>
              )}

              {signInError && (
                <div className="bg-[#EF4444]/15 border-2 border-[#1A1A2E] text-[#991B1B] text-xs font-bold p-3 rounded-xl shadow-[2px_2px_0px_#1A1A2E] flex items-start gap-2">
                  <span className="text-sm">⚠️</span>
                  <span>{signInError}</span>
                </div>
              )}

              <div>
                <label className="block text-xs font-black uppercase tracking-wider text-[#1A1A2E] mb-1.5">
                  Email Address
                </label>
                <input
                  type="email"
                  required
                  value={signInEmail}
                  onChange={(e) => setSignInEmail(e.target.value)}
                  placeholder="e.g. operator@applywizz.com"
                  className="w-full px-3.5 py-2.5 bg-[#FAF4EB] border-2 border-[#1A1A2E] rounded-xl text-xs font-medium text-[#1A1A2E] focus:outline-none focus:bg-white shadow-[2px_2px_0px_#1A1A2E]"
                />
              </div>

              <div>
                <label className="block text-xs font-black uppercase tracking-wider text-[#1A1A2E] mb-1.5">
                  Password
                </label>
                <input
                  type="password"
                  required
                  value={signInPassword}
                  onChange={(e) => setSignInPassword(e.target.value)}
                  placeholder="Enter your password"
                  className="w-full px-3.5 py-2.5 bg-[#FAF4EB] border-2 border-[#1A1A2E] rounded-xl text-xs font-medium text-[#1A1A2E] focus:outline-none focus:bg-white shadow-[2px_2px_0px_#1A1A2E]"
                />
              </div>

              <button
                type="submit"
                disabled={signInLoading}
                className="w-full mt-2 py-3 bg-[#E88474] hover:bg-[#d67262] text-white font-black text-xs uppercase tracking-wider border-2 border-[#1A1A2E] rounded-xl shadow-[3px_3px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px] transition-all disabled:opacity-50 disabled:cursor-not-allowed"
              >
                {signInLoading ? 'Signing In...' : 'Sign In →'}
              </button>
            </form>
          ) : (
            <div className="space-y-4">
              {signUpError && (
                <div className="bg-[#EF4444]/15 border-2 border-[#1A1A2E] text-[#991B1B] text-xs font-bold p-3 rounded-xl shadow-[2px_2px_0px_#1A1A2E] flex items-start gap-2">
                  <span className="text-sm">⚠️</span>
                  <span>{signUpError}</span>
                </div>
              )}

              {!isEmailVerified ? (
                <form onSubmit={handleVerifyEmail} className="space-y-4">
                  <div>
                    <label className="block text-xs font-black uppercase tracking-wider text-[#1A1A2E] mb-1.5">
                      Verify Authorization Email
                    </label>
                    <input
                      type="email"
                      required
                      value={signUpEmail}
                      onChange={(e) => setSignUpEmail(e.target.value)}
                      placeholder="e.g. operator@applywizz.com"
                      className="w-full px-3.5 py-2.5 bg-[#FAF4EB] border-2 border-[#1A1A2E] rounded-xl text-xs font-medium text-[#1A1A2E] focus:outline-none focus:bg-white shadow-[2px_2px_0px_#1A1A2E]"
                    />
                    <p className="text-[11px] font-mono text-[#64748B] mt-1.5">
                      We check if your email is on the authorized team/client access list before signup.
                    </p>
                  </div>

                  <button
                    type="submit"
                    disabled={verifyLoading}
                    className="w-full py-3 bg-[#1A1A2E] hover:bg-[#2A2A3E] text-white font-black text-xs uppercase tracking-wider border-2 border-[#1A1A2E] rounded-xl shadow-[3px_3px_0px_#E88474] active:translate-x-[1px] active:translate-y-[1px] transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    {verifyLoading ? 'Verifying Email...' : 'Confirm Email →'}
                  </button>
                </form>
              ) : (
                <form onSubmit={handleRegister} className="space-y-4">
                  <div className="bg-[#9AC89A]/30 border-2 border-[#1A1A2E] text-[#1E4620] p-3 rounded-xl shadow-[2px_2px_0px_#1A1A2E] flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-sm">✓</span>
                      <div>
                        <span className="text-[10px] uppercase font-bold tracking-wider block">Authorized Email</span>
                        <span className="text-xs font-mono font-bold">{signUpEmail}</span>
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={() => {
                        setIsEmailVerified(false);
                        setSignUpPassword('');
                        setSignUpConfirmPassword('');
                        setSignUpError('');
                      }}
                      className="text-[11px] font-bold underline hover:text-[#1A1A2E]"
                    >
                      Change
                    </button>
                  </div>

                  <div>
                    <label className="block text-xs font-black uppercase tracking-wider text-[#1A1A2E] mb-1.5">
                      Create Password
                    </label>
                    <input
                      type="password"
                      required
                      value={signUpPassword}
                      onChange={(e) => setSignUpPassword(e.target.value)}
                      placeholder="At least 6 characters"
                      className="w-full px-3.5 py-2.5 bg-[#FAF4EB] border-2 border-[#1A1A2E] rounded-xl text-xs font-medium text-[#1A1A2E] focus:outline-none focus:bg-white shadow-[2px_2px_0px_#1A1A2E]"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-black uppercase tracking-wider text-[#1A1A2E] mb-1.5">
                      Confirm Password
                    </label>
                    <input
                      type="password"
                      required
                      value={signUpConfirmPassword}
                      onChange={(e) => setSignUpConfirmPassword(e.target.value)}
                      placeholder="Re-enter password"
                      className="w-full px-3.5 py-2.5 bg-[#FAF4EB] border-2 border-[#1A1A2E] rounded-xl text-xs font-medium text-[#1A1A2E] focus:outline-none focus:bg-white shadow-[2px_2px_0px_#1A1A2E]"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={registerLoading}
                    className="w-full py-3 bg-[#E88474] hover:bg-[#d67262] text-white font-black text-xs uppercase tracking-wider border-2 border-[#1A1A2E] rounded-xl shadow-[3px_3px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px] transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    {registerLoading ? 'Creating Account...' : 'Complete Sign Up →'}
                  </button>
                </form>
              )}
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // Main App Component
    // -------------------------------------------------------------
    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('applywizz_auth_user');
          return saved ? JSON.parse(saved) : null;
        } catch {
          return null;
        }
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [candidates, setCandidates] = useState([]);
      const [stats, setStats] = useState(null);
      const [selectedCandidateId, setSelectedCandidateId] = useState(null);
      const [candidateDetail, setCandidateDetail] = useState(null);
      const [selectedJobUrl, setSelectedJobUrl] = useState(null);
      const [application, setApplication] = useState(null);

      const [isLoadingCandidates, setIsLoadingCandidates] = useState(true);
      const [isLoadingApplication, setIsLoadingApplication] = useState(false);

      const handleSignOut = () => {
        localStorage.removeItem('applywizz_auth_token');
        localStorage.removeItem('applywizz_auth_user');
        setCurrentUser(null);
      };

      const fetchInitialData = useCallback(async (isPolling = false) => {
        if (!isPolling) setIsLoadingCandidates(true);
        try {
          const [candidatesRes, statsRes] = await Promise.all([
            fetch('/api/candidates'),
            fetch('/api/stats'),
          ]);

          if (candidatesRes.ok) {
            const candidateData = await candidatesRes.json();
            setCandidates(candidateData);
            setSelectedCandidateId((prev) => {
              if (prev && prev !== 'AWL-YASWANTH' && candidateData.some((c) => c.applywizzId === prev)) return prev;
              return candidateData.length > 0 ? candidateData[0].applywizzId : null;
            });
          }

          if (statsRes.ok) {
            const statsData = await statsRes.json();
            setStats(statsData);
          }
        } catch (err) {
          console.error('Failed to load initial data:', err);
        } finally {
          if (!isPolling) setIsLoadingCandidates(false);
        }
      }, []);

      useEffect(() => {
        if (!currentUser) return;
        fetchInitialData(false);
        const pollInterval = setInterval(() => {
          fetchInitialData(true);
        }, 2500);
        return () => clearInterval(pollInterval);
      }, [currentUser, fetchInitialData]);

      const fetchCandidateDetail = useCallback(async (applywizzId) => {
        try {
          const res = await fetch(`/api/candidates/${applywizzId}`);
          if (res.ok) {
            const detail = await res.json();
            setCandidateDetail(detail);

            if (detail.jobs && detail.jobs.length > 0) {
              const firstJobUrl = detail.jobs[0].canonicalUrl || detail.jobs[0].rawUrl;
              setSelectedJobUrl(firstJobUrl);
            } else {
              setSelectedJobUrl(null);
              setApplication(null);
            }
          }
        } catch (err) {
          console.error(`Failed to fetch candidate ${applywizzId}:`, err);
        }
      }, []);

      useEffect(() => {
        if (selectedCandidateId) {
          fetchCandidateDetail(selectedCandidateId);
        }
      }, [selectedCandidateId, fetchCandidateDetail]);

      const fetchJobApplication = useCallback(async (applywizzId, jobUrl) => {
        setIsLoadingApplication(true);
        try {
          const encodedUrl = encodeURIComponent(jobUrl);
          const res = await fetch(`/api/candidates/${applywizzId}/jobs/${encodedUrl}`);
          if (res.ok) {
            const appData = await res.json();
            setApplication(appData);
          } else {
            setApplication(null);
          }
        } catch (err) {
          console.error(`Failed to fetch application for ${applywizzId} / ${jobUrl}:`, err);
          setApplication(null);
        } finally {
          setIsLoadingApplication(false);
        }
      }, []);

      useEffect(() => {
        if (selectedCandidateId && selectedJobUrl) {
          fetchJobApplication(selectedCandidateId, selectedJobUrl);
        }
      }, [selectedCandidateId, selectedJobUrl, fetchJobApplication]);

      const handleFieldUpdate = (updatedField) => {
        if (!application) return;
        const fields = application.resolvedFields || application.resolved_fields || [];
        const newResolvedFields = fields.map((f) =>
          f.fieldId === updatedField.fieldId || f.name === updatedField.fieldId ? updatedField : f
        );
        setApplication({
          ...application,
          resolvedFields: newResolvedFields,
          resolved_fields: newResolvedFields,
        });
      };

      const handleStatusChange = (newStatus, updatedPayload) => {
        if (!application) return;
        setApplication((prev) => ({
          ...prev,
          status: newStatus,
          proof_web_url: updatedPayload?.proofWebUrl || updatedPayload?.proof_web_url || prev.proof_web_url,
          proof_captured_at: updatedPayload?.proofCapturedAt || updatedPayload?.proof_captured_at || prev.proof_captured_at,
          dry_run_screenshot_url: updatedPayload?.screenshotUrl || updatedPayload?.dry_run_screenshot_url || prev.dry_run_screenshot_url,
        }));

        if (candidateDetail && selectedJobUrl) {
          const updatedJobs = candidateDetail.jobs.map((j) => {
            if (j.canonicalUrl === selectedJobUrl || j.rawUrl === selectedJobUrl) {
              return { ...j, status: newStatus };
            }
            return j;
          });
          setCandidateDetail({ ...candidateDetail, jobs: updatedJobs });
        }
      };

      if (!currentUser) {
        return (
          <div className="flex items-center justify-center min-h-screen w-screen bg-[#FFF5EB] p-4 select-none font-sans">
            <AuthView onAuthSuccess={(user) => setCurrentUser(user)} />
          </div>
        );
      }

      return (
        <div className="flex flex-col h-screen w-screen bg-[#FFF5EB] text-[#1A1A2E] font-sans overflow-hidden select-none">
          <header className="h-16 bg-[#FFF5EB] border-b-2 border-[#1A1A2E] flex items-center justify-between px-6 flex-shrink-0">
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full bg-[#1A1A2E] text-[#FFF5EB] flex items-center justify-center font-black text-sm border-2 border-[#1A1A2E] shadow-[2px_2px_0px_#E88474]">
                  AW
                </div>
                <div>
                  <span className="text-sm font-black tracking-tight text-[#1A1A2E] uppercase">
                    ApplyWizz
                  </span>
                  <span className="text-[10px] block font-mono text-[#64748B] font-bold">
                    Auto Apply V2
                  </span>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-2 bg-white border border-[#1A1A2E] rounded-md p-1 shadow-[2px_2px_0px_#1A1A2E]">
                <button
                  type="button"
                  onClick={() => setActiveTab('find-jobs')}
                  className={`px-3 py-1 text-xs font-bold rounded transition-all ${
                    activeTab === 'find-jobs'
                      ? 'bg-[#E88474] text-white'
                      : 'text-[#1A1A2E] hover:bg-[#FAF4EB]'
                  }`}
                >
                  Find Jobs
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-3 py-1 text-xs font-bold rounded transition-all ${
                    activeTab === 'dashboard'
                      ? 'bg-[#E88474] text-white'
                      : 'text-[#1A1A2E] hover:bg-[#FAF4EB]'
                  }`}
                >
                  Dashboard
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab('stats')}
                  className={`px-3 py-1 text-xs font-bold rounded transition-all ${
                    activeTab === 'stats'
                      ? 'bg-[#E88474] text-white'
                      : 'text-[#1A1A2E] hover:bg-[#FAF4EB]'
                  }`}
                >
                  Stats
                </button>
              </nav>
            </div>

            <div className="flex items-center gap-3">
              {stats && (
                <div className="hidden lg:flex items-center gap-2">
                  <div className="flex items-center gap-1.5 bg-[#F4D66B] border border-[#1A1A2E] px-2.5 py-1 rounded text-xs font-mono font-bold text-[#5C4A0A] shadow-[1px_1px_0px_#1A1A2E]">
                    <span>Candidates:</span>
                    <span>{stats.totalCandidates}</span>
                  </div>

                  <div className="flex items-center gap-1.5 bg-[#B8D4E8] border border-[#1A1A2E] px-2.5 py-1 rounded text-xs font-mono font-bold text-[#1E3A5F] shadow-[1px_1px_0px_#1A1A2E]">
                    <span>Jobs:</span>
                    <span>{stats.totalApplications}</span>
                  </div>

                  <div className="flex items-center gap-1.5 bg-[#9AC89A] border border-[#1A1A2E] px-2.5 py-1 rounded text-xs font-mono font-bold text-[#1E4620] shadow-[1px_1px_0px_#1A1A2E]">
                    <span>🌿 supabase: {stats.supabasePercentage}%</span>
                  </div>

                  <div className="flex items-center gap-1.5 bg-[#EDE9FE] border border-[#1A1A2E] px-2.5 py-1 rounded text-xs font-mono font-bold text-[#5B21B6] shadow-[1px_1px_0px_#1A1A2E]">
                    <span>🔮 ai: {stats.aiPercentage}%</span>
                  </div>
                </div>
              )}

              <button
                type="button"
                onClick={fetchInitialData}
                title="Refresh Data"
                className="text-xs bg-white hover:bg-[#FAF4EB] text-[#1A1A2E] border border-[#1A1A2E] px-2.5 py-1 rounded shadow-[2px_2px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px] font-bold transition-all"
              >
                ↻
              </button>

              <div className="relative p-1.5 bg-white border border-[#1A1A2E] rounded shadow-[2px_2px_0px_#1A1A2E] cursor-pointer">
                <span className="text-xs">🔔</span>
                <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-[#E88474] border border-[#1A1A2E] rounded-full"></span>
              </div>

              <div className="flex items-center gap-2 bg-white border border-[#1A1A2E] px-2.5 py-1 rounded shadow-[2px_2px_0px_#1A1A2E]">
                <div className="w-5 h-5 rounded-full bg-[#E88474] border border-[#1A1A2E] flex items-center justify-center text-[10px] font-black text-white uppercase">
                  {currentUser?.email ? currentUser.email.charAt(0) : 'U'}
                </div>
                <span className="text-xs font-bold text-[#1A1A2E] max-w-[130px] truncate hidden sm:inline" title={currentUser?.email}>
                  {currentUser?.email || 'Operator'}
                </span>
              </div>

              <button
                type="button"
                onClick={handleSignOut}
                title="Sign Out"
                className="text-xs bg-[#FFF5EB] hover:bg-[#E88474] hover:text-white text-[#1A1A2E] border border-[#1A1A2E] px-2.5 py-1 rounded shadow-[2px_2px_0px_#1A1A2E] active:translate-x-[1px] active:translate-y-[1px] font-bold transition-all"
              >
                Sign Out
              </button>
            </div>
          </header>

          {activeTab === 'stats' ? (
            <div className="flex-1 overflow-y-auto p-8 max-w-5xl mx-auto w-full custom-scrollbar">
              <div className="mb-6">
                <h2 className="text-2xl font-black text-[#1A1A2E]">Application Pipeline Stats</h2>
                <p className="text-xs text-[#64748B] font-mono mt-0.5">
                  Real-time throughput metrics, resolution tier breakdowns, and submission telemetry.
                </p>
              </div>

              {stats ? (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                  <div className="bg-[#FFF8D6] border-2 border-[#1A1A2E] rounded-xl p-5 shadow-[4px_4px_0px_#1A1A2E]">
                    <span className="text-xs font-bold uppercase tracking-wider text-[#5C4A0A]">
                      Total Candidates
                    </span>
                    <div className="text-3xl font-black text-[#1A1A2E] mt-2">
                      {stats.totalCandidates}
                    </div>
                    <div className="text-[11px] font-mono text-[#5C4A0A] mt-1">
                      Ingested &amp; segregated
                    </div>
                  </div>

                  <div className="bg-[#E2F0FB] border-2 border-[#1A1A2E] rounded-xl p-5 shadow-[4px_4px_0px_#1A1A2E]">
                    <span className="text-xs font-bold uppercase tracking-wider text-[#1E3A5F]">
                      Total Applications
                    </span>
                    <div className="text-3xl font-black text-[#1A1A2E] mt-2">
                      {stats.totalApplications}
                    </div>
                    <div className="text-[11px] font-mono text-[#1E3A5F] mt-1">
                      Active job assignments
                    </div>
                  </div>

                  <div className="bg-[#E2F5E2] border-2 border-[#1A1A2E] rounded-xl p-5 shadow-[4px_4px_0px_#1A1A2E]">
                    <span className="text-xs font-bold uppercase tracking-wider text-[#1E4620]">
                      Supabase Cache
                    </span>
                    <div className="text-3xl font-black text-[#1A1A2E] mt-2">
                      {stats.supabasePercentage}%
                    </div>
                    <div className="text-[11px] font-mono text-[#1E4620] mt-1">
                      {stats.supabaseTaggedCount} fields (0 API calls)
                    </div>
                  </div>

                  <div className="bg-[#FFEAE8] border-2 border-[#1A1A2E] rounded-xl p-5 shadow-[4px_4px_0px_#1A1A2E]">
                    <span className="text-xs font-bold uppercase tracking-wider text-[#6B2C2C]">
                      AI Synthesis
                    </span>
                    <div className="text-3xl font-black text-[#1A1A2E] mt-2">
                      {stats.aiPercentage}%
                    </div>
                    <div className="text-[11px] font-mono text-[#6B2C2C] mt-1">
                      {stats.aiTaggedCount} fields synthesized
                    </div>
                  </div>
                </div>
              ) : (
                <div className="p-8 text-center text-xs font-mono text-[#64748B]">Loading statistics...</div>
              )}
            </div>
          ) : (
            <div className="flex flex-1 overflow-hidden">
              <CandidateList
                candidates={candidates}
                selectedId={selectedCandidateId}
                onSelectCandidate={(id) => setSelectedCandidateId(id)}
                isLoading={isLoadingCandidates}
              />

              <main className="flex-1 flex flex-col bg-[#FFF5EB] overflow-hidden">
                {candidateDetail ? (
                  <>
                    <JobQueueView
                      candidate={candidateDetail}
                      selectedJobUrl={selectedJobUrl}
                      onSelectJob={(url) => setSelectedJobUrl(url)}
                    />
                    <FormRenderer
                      application={application}
                      isLoading={isLoadingApplication}
                      candidateName={candidateDetail.clientName}
                      onFieldUpdate={handleFieldUpdate}
                      onStatusChange={handleStatusChange}
                    />
                  </>
                ) : (
                  <div className="flex-1 flex flex-col items-center justify-center text-[#64748B]">
                    <div className="text-4xl mb-2">👤</div>
                    <p className="text-sm font-bold text-[#1A1A2E]">No Candidate Selected</p>
                    <p className="text-xs text-[#64748B] mt-1 font-medium">
                      Select a candidate from the left directory to view assigned applications.
                    </p>
                  </div>
                )}
              </main>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
