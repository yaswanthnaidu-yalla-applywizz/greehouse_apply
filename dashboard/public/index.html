<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenhouse Automation Platform — Operator Dashboard (V2)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            page: '#FFF5EB',
            sidebar: '#1A1A2E',
            card: '#FFFFFF',
            'metric-yellow': '#F4D66B',
            'metric-yellow-text': '#5C4A0A',
            'metric-coral': '#E88474',
            'metric-coral-text': '#6B2C2C',
            'metric-green': '#9AC89A',
            'metric-green-text': '#2D5C2D',
            'metric-blue': '#B8D4E8',
            'metric-blue-text': '#2D5C8C',
            supabase: '#10B981',
            ai: '#8B5CF6',
            manual: '#F59E0B',
            unresolved: '#EF4444'
          }
        }
      }
    }
  </script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbars */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #FFF5EB;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #D6C7B7;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #BFADA0;
    }

    /* Sidebar dark scrollbar */
    .sidebar-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .sidebar-scrollbar::-webkit-scrollbar-track {
      background: #131322;
    }
    .sidebar-scrollbar::-webkit-scrollbar-thumb {
      background: #2E2E4A;
      border-radius: 3px;
    }
    .sidebar-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #3E3E60;
    }
  </style>
</head>
<body class="bg-[#FFF5EB] text-[#1E293B] antialiased overflow-hidden select-none font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const API_BASE_URL = window.location.origin;

    function SourceBadge({ source, confidence, isEdited }) {
      const activeSource = isEdited ? 'manual' : source;

      if (activeSource === 'manual') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold font-mono bg-amber-50 text-amber-800 border border-amber-400 shadow-sm">
            <span className="w-1.5 h-1.5 rounded-full bg-amber-600"></span>
            <span>manual</span>
          </span>
        );
      }

      if (activeSource === 'unresolved') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold font-mono bg-rose-50 text-rose-800 border border-rose-400 shadow-sm">
            <span className="w-1.5 h-1.5 rounded-full bg-rose-600 animate-pulse"></span>
            <span>unresolved</span>
          </span>
        );
      }

      if (activeSource === 'supabase') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold font-mono bg-emerald-50 text-emerald-800 border border-emerald-400 shadow-sm">
            <span className="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
            <span>supabase</span>
            {confidence !== undefined && (
              <span className="text-[10px] text-emerald-700/80">({(confidence * 100).toFixed(0)}%)</span>
            )}
          </span>
        );
      }

      if (activeSource === 'resume_parse') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold font-mono bg-cyan-50 text-cyan-800 border border-cyan-400 shadow-sm">
            <span className="w-1.5 h-1.5 rounded-full bg-cyan-600"></span>
            <span>resume</span>
          </span>
        );
      }

      if (activeSource === 'fuzzy_match') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold font-mono bg-blue-50 text-blue-800 border border-blue-400 shadow-sm">
            <span className="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
            <span>fuzzy</span>
            {confidence !== undefined && (
              <span className="text-[10px] text-blue-700/80">({(confidence * 100).toFixed(0)}%)</span>
            )}
          </span>
        );
      }

      if (activeSource === 'api') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold font-mono bg-indigo-50 text-indigo-800 border border-indigo-400 shadow-sm">
            <span className="w-1.5 h-1.5 rounded-full bg-indigo-600"></span>
            <span>api</span>
          </span>
        );
      }

      // Default: 'ai'
      return (
        <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold font-mono bg-purple-50 text-purple-800 border border-purple-400 shadow-sm">
          <span className="w-1.5 h-1.5 rounded-full bg-purple-600"></span>
          <span>ai</span>
          {confidence !== undefined && (
            <span className="text-[10px] text-purple-700/80">({(confidence * 100).toFixed(0)}%)</span>
          )}
        </span>
      );
    }

    function EditableFormField({ field, applicationId, onFieldUpdate }) {
      const [isEditing, setIsEditing] = useState(false);
      const [value, setValue] = useState(field.value || '');
      const [isSaving, setIsSaving] = useState(false);
      const [error, setError] = useState(null);
      const inputRef = useRef(null);

      useEffect(() => {
        setValue(field.value || '');
      }, [field.value]);

      useEffect(() => {
        if (isEditing && inputRef.current) {
          inputRef.current.focus();
        }
      }, [isEditing]);

      const handleSave = async () => {
        if (value === field.value && !error) {
          setIsEditing(false);
          return;
        }

        setIsSaving(true);
        setError(null);

        try {
          const response = await fetch(
            `${API_BASE_URL}/api/applications/${encodeURIComponent(applicationId)}/fields/${encodeURIComponent(field.fieldId)}`,
            {
              method: 'PATCH',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ value }),
            }
          );

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || `HTTP error ${response.status}`);
          }

          const updatedField = await response.json();
          setIsEditing(false);
          if (onFieldUpdate) {
            onFieldUpdate(updatedField);
          }
        } catch (err) {
          console.error('Failed to update field:', err);
          setError(err.message || 'Failed to save');
        } finally {
          setIsSaving(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Escape') {
          setValue(field.value || '');
          setError(null);
          setIsEditing(false);
        } else if (e.key === 'Enter' && field.type !== 'textarea') {
          e.preventDefault();
          handleSave();
        }
      };

      const isTextarea = field.type === 'textarea';

      return (
        <div className="group relative p-4 rounded-xl border border-slate-200/90 hover:border-slate-300 bg-white transition-all shadow-sm">
          <div className="flex items-start justify-between gap-3 mb-2">
            <div className="flex-1">
              <label className="text-xs font-semibold text-slate-800 flex items-center gap-1.5">
                <span>{field.label || field.name || field.fieldId}</span>
                <span className="text-[10px] font-mono text-slate-400 font-normal">({field.type})</span>
              </label>
            </div>

            <div className="flex items-center gap-2 shrink-0">
              <SourceBadge
                source={field.source}
                confidence={field.confidence}
                isEdited={field.isEdited}
              />

              {!isEditing && (
                <button
                  type="button"
                  onClick={() => setIsEditing(true)}
                  title="Click to edit field value"
                  className="opacity-0 group-hover:opacity-100 p-1 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-md transition text-xs"
                >
                  ✏️
                </button>
              )}
            </div>
          </div>

          {isEditing ? (
            <div className="relative mt-1">
              {isTextarea ? (
                <textarea
                  ref={inputRef}
                  value={value}
                  onChange={(e) => setValue(e.target.value)}
                  onBlur={handleSave}
                  onKeyDown={handleKeyDown}
                  disabled={isSaving}
                  rows={3}
                  className="w-full text-xs font-mono p-2.5 bg-amber-50/20 border-2 border-amber-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-200 transition text-slate-900"
                />
              ) : (
                <input
                  ref={inputRef}
                  type="text"
                  value={value}
                  onChange={(e) => setValue(e.target.value)}
                  onBlur={handleSave}
                  onKeyDown={handleKeyDown}
                  disabled={isSaving}
                  className="w-full text-xs font-mono p-2 bg-amber-50/20 border-2 border-amber-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-200 transition text-slate-900"
                />
              )}

              <div className="flex items-center justify-between mt-1 text-[10px] text-slate-400 font-mono">
                <span>Press Enter to save, Esc to cancel</span>
                {isSaving && <span className="text-amber-600 font-semibold animate-pulse">Saving...</span>}
                {error && <span className="text-rose-600 font-semibold">{error}</span>}
              </div>
            </div>
          ) : (
            <div
              onClick={() => setIsEditing(true)}
              title="Click to edit"
              className="mt-1 p-2.5 rounded-lg bg-slate-50/80 border border-slate-100 hover:bg-slate-100/80 cursor-pointer transition text-xs font-mono break-words"
            >
              {field.value && field.value.trim().length > 0 ? (
                <span className="text-slate-900">{field.value}</span>
              ) : (
                <span className="text-slate-400 italic">No answer provided (click to edit)</span>
              )}
            </div>
          )}
        </div>
      );
    }

    function CandidateList({ candidates, selectedId, onSelectCandidate, isLoading }) {
      const [searchTerm, setSearchTerm] = useState('');

      const filteredCandidates = useMemo(() => {
        const query = searchTerm.toLowerCase().trim();
        if (!query) return candidates;
        return candidates.filter(
          (c) =>
            c.clientName.toLowerCase().includes(query) ||
            c.applywizzId.toLowerCase().includes(query) ||
            (c.email && c.email.toLowerCase().includes(query))
        );
      }, [candidates, searchTerm]);

      return (
        <aside className="w-80 flex-shrink-0 bg-[#1A1A2E] border-r border-[#131322] flex flex-col h-full overflow-hidden text-white">
          <div className="p-4 border-b border-[#24243E] bg-[#1A1A2E] sticky top-0 z-10">
            <div className="flex items-center justify-between mb-2">
              <h2 className="text-xs font-bold uppercase tracking-wider text-[#94A3B8]">
                Candidates Directory
              </h2>
              <span className="text-xs font-mono bg-[#24243E] text-[#E2E8F0] px-2 py-0.5 rounded-full font-semibold">
                {filteredCandidates.length} of {candidates.length}
              </span>
            </div>

            <div className="relative">
              <input
                type="text"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                placeholder="Search name or AWL-ID..."
                className="w-full bg-[#131324] border border-[#2E2E4A] rounded-lg px-3 py-2 text-xs text-white placeholder-[#64748B] focus:outline-none focus:ring-2 focus:ring-[#F4D66B]/50 focus:border-[#F4D66B] transition-all"
              />
              {searchTerm && (
                <button
                  type="button"
                  onClick={() => setSearchTerm('')}
                  className="absolute right-2.5 top-2 text-[#94A3B8] hover:text-white text-xs"
                >
                  ✕
                </button>
              )}
            </div>
          </div>

          <div className="flex-1 overflow-y-auto divide-y divide-[#24243E]/60 p-2 space-y-1.5 sidebar-scrollbar">
            {isLoading ? (
              <div className="p-6 text-center text-xs text-[#94A3B8] animate-pulse">
                Loading candidate records...
              </div>
            ) : filteredCandidates.length === 0 ? (
              <div className="p-6 text-center text-xs text-[#94A3B8]">
                No candidates matching <span className="text-white">"{searchTerm}"</span>
              </div>
            ) : (
              filteredCandidates.map((c) => {
                const isSelected = c.applywizzId === selectedId;
                return (
                  <button
                    key={c.applywizzId}
                    type="button"
                    onClick={() => onSelectCandidate(c.applywizzId)}
                    className={`w-full text-left p-3 rounded-xl transition-all duration-150 relative ${
                      isSelected
                        ? 'bg-[#2E2E54] border-2 border-[#F4D66B] shadow-lg shadow-black/20'
                        : 'bg-[#24243E]/50 border border-[#2F2F4E] hover:bg-[#2A2A48] hover:border-[#3D3D64]'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-mono font-bold text-[#9AC89A] bg-[#1A1A2E] border border-[#355639] px-1.5 py-0.5 rounded">
                        {c.applywizzId}
                      </span>
                      {c.status === 'READY' && (
                        <span className="inline-flex items-center gap-1 text-[10px] font-medium text-[#9AC89A] bg-[#9AC89A]/20 px-2 py-0.5 rounded-full border border-[#9AC89A]/40">
                          <span className="w-1.5 h-1.5 rounded-full bg-[#9AC89A] animate-pulse"></span>
                          Ready
                        </span>
                      )}
                      {c.status === 'PENDING' && (
                        <span className="inline-flex items-center gap-1 text-[10px] font-medium text-[#F4D66B] bg-[#F4D66B]/20 px-2 py-0.5 rounded-full border border-[#F4D66B]/40">
                          <span className="w-1.5 h-1.5 rounded-full bg-[#F4D66B]"></span>
                          Pending
                        </span>
                      )}
                      {c.status === 'EXPIRED' && (
                        <span className="inline-flex items-center gap-1 text-[10px] font-medium text-[#94A3B8] bg-[#24243E] px-2 py-0.5 rounded-full border border-[#3D3D64]">
                          Expired
                        </span>
                      )}
                    </div>

                    <div className="text-sm font-semibold text-white truncate mb-1">
                      {c.clientName}
                    </div>

                    <div className="flex items-center justify-between text-[11px] text-[#94A3B8]">
                      <span className="truncate max-w-[140px] text-[#94A3B8] font-mono">
                        {c.email || c.location || 'Profile Synced'}
                      </span>
                      <span className="bg-[#131324] border border-[#2E2E4A] text-[#CBD5E1] px-2 py-0.5 rounded text-[10px] font-semibold font-mono">
                        {c.totalJobs} {c.totalJobs === 1 ? 'Job' : 'Jobs'}
                      </span>
                    </div>
                  </button>
                );
              })
            )}
          </div>
        </aside>
      );
    }

    function JobQueueView({ candidate, selectedJobUrl, onSelectJob }) {
      if (!candidate || !candidate.jobs || candidate.jobs.length === 0) {
        return (
          <div className="p-4 bg-[#FFF5EB] border-b border-[#E8DCCF] text-xs text-[#64748B]">
            No jobs assigned for this candidate.
          </div>
        );
      }

      return (
        <div className="bg-[#FFF5EB] border-b border-[#E8DCCF] px-6 pt-3">
          <div className="flex items-center justify-between mb-2.5">
            <div className="flex items-center gap-2">
              <span className="text-xs font-bold uppercase tracking-wider text-[#1E293B]">
                Assigned Applications Queue
              </span>
              <span className="text-[11px] font-mono bg-[#B8D4E8] border border-[#A2C5DD] text-[#2D5C8C] px-2.5 py-0.5 rounded-full font-semibold">
                {candidate.jobs.length} Active
              </span>
              <span className="text-[11px] font-mono bg-[#9AC89A] border border-[#84B784] text-[#2D5C2D] px-2.5 py-0.5 rounded-full font-semibold">
                ⚡ &lt; 23 Qs
              </span>
            </div>

            {candidate.resumeUrl && (
              <a
                href={candidate.resumeUrl}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-1.5 text-xs font-semibold text-[#059669] hover:text-[#047857] bg-[#FFFFFF] border border-[#84B784] hover:border-[#059669] px-3 py-1 rounded-lg shadow-sm transition-colors"
              >
                <span>📄</span>
                <span>Master Resume PDF</span>
              </a>
            )}
          </div>

          <div className="flex gap-2 overflow-x-auto pb-3 custom-scrollbar">
            {candidate.jobs.map((job, idx) => {
              const jobKey = job.canonicalUrl || job.rawUrl;
              const isSelected =
                selectedJobUrl === jobKey ||
                selectedJobUrl === job.rawUrl ||
                selectedJobUrl === job.canonicalUrl;

              return (
                <button
                  key={`${jobKey}-${idx}`}
                  type="button"
                  onClick={() => onSelectJob(jobKey)}
                  className={`flex-shrink-0 text-left px-4 py-2.5 rounded-xl border transition-all duration-150 min-w-[220px] max-w-[280px] ${
                    isSelected
                      ? 'bg-[#FFFFFF] border-2 border-[#1A1A2E] shadow-md ring-2 ring-[#1A1A2E]/10'
                      : 'bg-[#FFFFFF] border-[#E8DCCF] hover:border-[#CDBDAE] shadow-sm'
                  }`}
                >
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-xs font-bold text-[#0F172A] truncate">
                      {job.companyName || 'Company'}
                    </span>
                    {job.status === 'READY_FOR_REVIEW' && (
                      <span className="text-[10px] font-mono text-[#059669] font-semibold">
                        🟢 Ready
                      </span>
                    )}
                    {job.status === 'EXPIRED' && (
                      <span className="text-[10px] font-mono text-[#E11D48] font-semibold">
                        🔴 Expired
                      </span>
                    )}
                    {job.status === 'PENDING' && (
                      <span className="text-[10px] font-mono text-[#D97706] font-semibold">
                        🟡 Pending
                      </span>
                    )}
                  </div>

                  <div className="text-xs text-[#334155] truncate font-medium">
                    {job.jobTitle || 'Job Application'}
                  </div>

                  <div className="text-[10px] text-[#64748B] mt-1 flex items-center justify-between">
                    <span>{job.fieldsCount ? `${job.fieldsCount} Questions` : 'Scanned'}</span>
                    <span className="font-mono text-[#94A3B8]">#{idx + 1}</span>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function FormRenderer({ application, isLoading, onFieldUpdate }) {
      if (isLoading) {
        return (
          <div className="flex-1 p-12 flex flex-col items-center justify-center text-[#64748B]">
            <div className="w-8 h-8 border-2 border-[#059669] border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-xs font-mono">Loading resolved application questions...</p>
          </div>
        );
      }

      if (!application) {
        return (
          <div className="flex-1 p-12 flex flex-col items-center justify-center text-[#64748B]">
            <div className="text-3xl mb-2">📋</div>
            <p className="text-sm font-semibold text-[#1E293B]">No Job Selected</p>
            <p className="text-xs text-[#64748B] mt-1">
              Select a candidate and job tab to inspect and edit pre-populated form questions.
            </p>
          </div>
        );
      }

      const manualCount = application.resolvedFields.filter((f) => f.isEdited || f.source === 'manual').length;
      const supabaseCount = application.resolvedFields.filter((f) => f.source === 'supabase' && !f.isEdited).length;
      const aiCount = application.resolvedFields.filter((f) => f.source === 'ai' && !f.isEdited).length;
      const unresCount = application.resolvedFields.filter((f) => f.source === 'unresolved').length;

      return (
        <div className="flex-1 overflow-y-auto p-8 max-w-4xl mx-auto w-full custom-scrollbar">
          <div className="bg-[#FFFFFF] border border-[#E8DCCF] rounded-xl p-6 mb-8 shadow-sm">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-[#E8DCCF] pb-5 mb-5">
              <div>
                <div className="flex items-center gap-2 mb-1.5">
                  <span className="text-xs font-bold uppercase tracking-wider text-[#64748B]">
                    {application.companyName || 'Greenhouse Posting'}
                  </span>
                  <span className="text-[#CBD5E1]">•</span>
                  <span className="text-xs font-mono text-[#059669] bg-[#FAF6F0] px-2 py-0.5 rounded border border-[#9AC89A]">
                    {application.applywizzId}
                  </span>
                </div>
                <h1 className="text-xl font-bold text-[#0F172A]">
                  {application.jobTitle || 'Application Form'}
                </h1>
                <a
                  href={application.jobUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-xs text-[#0284C7] hover:text-[#0369A1] font-mono underline break-all mt-1 inline-block"
                >
                  {application.jobUrl}
                </a>
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                {manualCount > 0 && (
                  <div className="bg-amber-50 border border-amber-300 px-3 py-1.5 rounded-xl text-center">
                    <div className="text-xs font-mono font-bold text-amber-800">{manualCount}</div>
                    <div className="text-[10px] text-amber-700 uppercase tracking-wider font-semibold">manual</div>
                  </div>
                )}
                <div className="bg-[#9AC89A]/30 border border-[#9AC89A] px-3 py-1.5 rounded-xl text-center">
                  <div className="text-xs font-mono font-bold text-[#2D5C2D]">{supabaseCount}</div>
                  <div className="text-[10px] text-[#2D5C2D] uppercase tracking-wider font-semibold">supabase</div>
                </div>
                <div className="bg-[#8B5CF6]/15 border border-[#8B5CF6]/40 px-3 py-1.5 rounded-xl text-center">
                  <div className="text-xs font-mono font-bold text-[#6D28D9]">{aiCount}</div>
                  <div className="text-[10px] text-[#6D28D9] uppercase tracking-wider font-semibold">ai</div>
                </div>
                {unresCount > 0 && (
                  <div className="bg-rose-50 border border-rose-300 px-3 py-1.5 rounded-xl text-center">
                    <div className="text-xs font-mono font-bold text-rose-800">{unresCount}</div>
                    <div className="text-[10px] text-rose-700 uppercase tracking-wider font-semibold">unresolved</div>
                  </div>
                )}
              </div>
            </div>

            <div className="bg-[#FAF6F0] border border-[#E8DCCF] rounded-lg px-4 py-2.5 flex items-center justify-between text-xs text-[#64748B]">
              <div className="flex items-center gap-2">
                <span className="text-amber-600">✏️</span>
                <span>Interactive Operator Review (V2) — Click any field or ✏️ to edit answers inline</span>
              </div>
              <span className="text-[11px] font-mono text-[#64748B]">
                {application.resolvedFields.length} Form Fields
              </span>
            </div>
          </div>

          <div className="space-y-4">
            {application.resolvedFields.length === 0 ? (
              <div className="bg-[#FFFFFF] border border-[#E8DCCF] rounded-xl p-8 text-center text-[#64748B] shadow-sm">
                <p className="text-sm">No interactive form fields extracted for this job posting.</p>
                {application.status === 'EXPIRED' && (
                  <p className="text-xs text-[#E11D48] mt-1">This job posting appears to be closed or expired.</p>
                )}
              </div>
            ) : (
              application.resolvedFields.map((field, index) => {
                const appId = application.applywizzId || 'app-default';
                return (
                  <EditableFormField
                    key={`${field.fieldId}-${index}`}
                    field={field}
                    applicationId={appId}
                    onFieldUpdate={onFieldUpdate}
                  />
                );
              })
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [candidates, setCandidates] = useState([]);
      const [stats, setStats] = useState(null);
      const [selectedCandidateId, setSelectedCandidateId] = useState(null);
      const [candidateDetail, setCandidateDetail] = useState(null);
      const [selectedJobUrl, setSelectedJobUrl] = useState(null);
      const [application, setApplication] = useState(null);

      const [isLoadingCandidates, setIsLoadingCandidates] = useState(true);
      const [isLoadingApplication, setIsLoadingApplication] = useState(false);

      const fetchInitialData = useCallback(async () => {
        setIsLoadingCandidates(true);
        try {
          const [candidatesRes, statsRes] = await Promise.all([
            fetch(`${API_BASE_URL}/api/candidates`),
            fetch(`${API_BASE_URL}/api/stats`),
          ]);

          if (candidatesRes.ok) {
            const candidateData = await candidatesRes.json();
            setCandidates(candidateData);
            if (candidateData.length > 0 && !selectedCandidateId) {
              setSelectedCandidateId(candidateData[0].applywizzId);
            }
          }

          if (statsRes.ok) {
            const statsData = await statsRes.json();
            setStats(statsData);
          }
        } catch (err) {
          console.error('Failed to load initial data:', err);
        } finally {
          setIsLoadingCandidates(false);
        }
      }, [selectedCandidateId]);

      useEffect(() => {
        fetchInitialData();
      }, [fetchInitialData]);

      const fetchCandidateDetail = useCallback(async (applywizzId) => {
        try {
          const res = await fetch(`${API_BASE_URL}/api/candidates/${applywizzId}`);
          if (res.ok) {
            const detail = await res.json();
            setCandidateDetail(detail);

            if (detail.jobs && detail.jobs.length > 0) {
              const firstJobUrl = detail.jobs[0].canonicalUrl || detail.jobs[0].rawUrl;
              setSelectedJobUrl(firstJobUrl);
            } else {
              setSelectedJobUrl(null);
              setApplication(null);
            }
          }
        } catch (err) {
          console.error(`Failed to fetch candidate ${applywizzId}:`, err);
        }
      }, []);

      useEffect(() => {
        if (selectedCandidateId) {
          fetchCandidateDetail(selectedCandidateId);
        }
      }, [selectedCandidateId, fetchCandidateDetail]);

      const fetchJobApplication = useCallback(async (applywizzId, jobUrl) => {
        setIsLoadingApplication(true);
        try {
          const encodedUrl = encodeURIComponent(jobUrl);
          const res = await fetch(`${API_BASE_URL}/api/candidates/${applywizzId}/jobs/${encodedUrl}`);

          if (res.ok) {
            const appData = await res.json();
            setApplication(appData);
          } else {
            setApplication(null);
          }
        } catch (err) {
          console.error(`Failed to fetch application for ${applywizzId} / ${jobUrl}:`, err);
          setApplication(null);
        } finally {
          setIsLoadingApplication(false);
        }
      }, []);

      useEffect(() => {
        if (selectedCandidateId && selectedJobUrl) {
          fetchJobApplication(selectedCandidateId, selectedJobUrl);
        }
      }, [selectedCandidateId, selectedJobUrl, fetchJobApplication]);

      const handleFieldUpdate = (updatedField) => {
        if (!application) return;

        const newResolvedFields = application.resolvedFields.map((f) =>
          f.fieldId === updatedField.fieldId || f.name === updatedField.fieldId ? updatedField : f
        );

        setApplication({
          ...application,
          resolvedFields: newResolvedFields,
        });
      };

      return (
        <div className="flex flex-col h-screen w-screen bg-[#FFF5EB] text-[#1E293B] font-sans overflow-hidden select-none">
          <header className="h-16 bg-[#FFFFFF] border-b border-[#E8DCCF] flex items-center justify-between px-6 flex-shrink-0 shadow-sm">
            <div className="flex items-center gap-3">
              <span className="text-2xl">🟢</span>
              <div>
                <h1 className="text-sm font-bold tracking-tight text-[#1A1A2E]">
                  Greenhouse Automation Platform
                </h1>
                <p className="text-[10px] text-[#64748B] font-mono">
                  Phase V2 Operator Dashboard · Interactive Inline Review
                </p>
              </div>
            </div>

            {stats && (
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-1.5 bg-[#F4D66B] border border-[#E5C350] px-3 py-1.5 rounded-lg text-xs font-mono font-semibold shadow-sm">
                  <span className="text-[#5C4A0A]">Candidates:</span>
                  <span className="text-[#5C4A0A] font-bold">{stats.totalCandidates}</span>
                </div>

                <div className="flex items-center gap-1.5 bg-[#B8D4E8] border border-[#A2C5DD] px-3 py-1.5 rounded-lg text-xs font-mono font-semibold shadow-sm">
                  <span className="text-[#2D5C8C]">Jobs:</span>
                  <span className="text-[#2D5C8C] font-bold">{stats.totalApplications}</span>
                </div>

                <div className="flex items-center gap-1.5 bg-[#9AC89A] border border-[#84B784] px-3 py-1.5 rounded-lg text-xs font-mono font-semibold shadow-sm">
                  <span className="text-[#2D5C2D] font-bold">🟢 supabase: {stats.supabasePercentage}%</span>
                </div>

                <div className="flex items-center gap-1.5 bg-[#E88474] border border-[#D87060] px-3 py-1.5 rounded-lg text-xs font-mono font-semibold shadow-sm">
                  <span className="text-[#6B2C2C] font-bold">🟣 ai: {stats.aiPercentage}%</span>
                </div>

                <button
                  type="button"
                  onClick={fetchInitialData}
                  className="text-xs bg-[#FFFFFF] hover:bg-[#FAF6F0] text-[#1E293B] border border-[#D8C7B5] px-3 py-1.5 rounded-lg transition-colors font-medium shadow-sm"
                >
                  ↻ Refresh
                </button>
              </div>
            )}
          </header>

          <div className="flex flex-1 overflow-hidden">
            <CandidateList
              candidates={candidates}
              selectedId={selectedCandidateId}
              onSelectCandidate={(id) => setSelectedCandidateId(id)}
              isLoading={isLoadingCandidates}
            />

            <main className="flex-1 flex flex-col bg-[#FFF5EB] overflow-hidden">
              {candidateDetail ? (
                <>
                  <JobQueueView
                    candidate={candidateDetail}
                    selectedJobUrl={selectedJobUrl}
                    onSelectJob={(url) => setSelectedJobUrl(url)}
                  />
                  <FormRenderer
                    application={application}
                    isLoading={isLoadingApplication}
                    onFieldUpdate={handleFieldUpdate}
                  />
                </>
              ) : (
                <div className="flex-1 flex flex-col items-center justify-center text-[#64748B]">
                  <p className="text-sm">Select a candidate to view assigned applications.</p>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
