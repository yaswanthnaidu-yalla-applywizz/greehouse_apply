name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'fix/**'
      - 'feature/**'
      - 'hotfix/**'
      - 'patch/**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application and dashboard
        run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          node --import tsx --test \
            tests/authUserLookup.test.ts \
            tests/batchLlmValidation.test.ts \
            tests/candidateQueueFilter.test.ts \
            tests/choiceOptions.test.ts \
            tests/dashboardDateRange.test.ts \
            tests/dashboardRoleResolution.test.ts \
            tests/ensureSupabaseProfile.test.ts \
            tests/managerDashboardMetrics.test.ts \
            tests/operatorErrorMessages.test.ts \
            tests/operatorManagerMapping.test.ts \
            tests/resolverDiagnosedFixes.test.ts \
            tests/questionLimit.test.ts \
            tests/upsertProfileCountry.test.ts \
            tests/zohoApiOtp.test.ts
        env:
          FORCE_MEMORY_DB: 'true'
          NODE_ENV: test

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Railway production image
        run: docker build --tag greehouse-apply-ci .
