name: CI & Verification Checks

on:
  push:
    branches:
      - main
      - master
      - 'V1-*'
      - 'V2-*'
  pull_request:
    branches:
      - main
      - master
      - 'V1-*'
      - 'V2-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Typecheck & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Compilation & Typecheck
        run: npm run typecheck

      - name: 🧪 Run Automated Verification Suite
        run: npm test
        env:
          NODE_ENV: test
          INPUT_CSV_PATH: ./output/ci_test_sample.csv
          OUTPUT_DIR: ./output
          RESUMES_DIR: ./resumes
          MAX_JOB_QUESTIONS: 23
          LLM_PROVIDER: openrouter
          SCANNER_JITTER_MIN_MS: 0
          SCANNER_JITTER_MAX_MS: 0
